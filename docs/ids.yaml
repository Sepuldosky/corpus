      Acuñada el 2026-07-24 al entrar el banco de sonidos (decisión del autor: los
      sonidos GENERALES viven en Corpus y cada módulo consume los suyos; separación
      sonidos/ítems con el addon de contenido). Es STK-2 aplicada al framework: STK-2
      rige corpus-stalker, COR-17 rige acá — misma política, dos sedes porque son dos
      repos con .gitignore propio. No viola COR-10: assets compartidos no son lógica
      de dominio, y el consumo es por detección (COR-5).
  COR-18:
    titulo: "Toda persistencia de ESTADO propio de un módulo pasa por Corpus.Data; file.* no se usa para eso."
    sede: "corpus/CLAUDE.md §Contratos que no debes romper · 3"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: codigo, ref: "corpus-cargo/lua/corpus_cargo/server/corpus_cargo_capture.lua — el catálogo autogen pasa entero por la primitiva; ningún módulo escribe una tabla de estado con file.Write" }
      - { tipo: codigo, ref: "corpus-cargo/lua/corpus_cargo/server/corpus_cargo_icons.lua — ídem icon_overrides" }
      - { tipo: harness, ref: "dev/harness_cargo.py — bloque «B2: Corpus.Data gana List, Delete y scope» + la purga de inst_* legacy (16 checks)" }
      - { tipo: planilla, ref: "Corpus T8 — en juego (2026-07-25): la purga borra POR LA PRIMITIVA y deja en pie inv_/cont_/trader_ y el catálogo; 2 de 2 claves inst_* legacy" }
      - { tipo: planilla, ref: "Corpus T7 — el dry run lista por List y no borra: la primitiva de lectura y la de borrado son actos separados" }
      - { tipo: planilla, ref: "Corpus T3 — el selftest borra por la primitiva lo que escribió: el namespace queda limpio en disco" }
    nota: >
      QUÉ RIGE, decidido ABRIENDO EL ÁRBOL y no la prosa (2026-07-25): la norma
      gobierna TABLAS de estado propio. Quedan fuera POR CONSTRUCCIÓN los artefactos
      que Corpus.Data no sabe guardar — serializa una tabla a JSON y nada más:
        · el dump de diagnóstico en TEXTO PLANO (weapon_dump.txt, corpus_cargo_dev.lua);
        · los PNG del caché de íconos (corpus_cargo_icons.lua client), que son binarios.
      Y file.Exists(..., "GAME") NUNCA fue candidato: es DETECCIÓN de assets montados
      (COR-5, COR-17, STK-2), no persistencia. Se dice acá en vez de fingir que esos
      call sites no existen — una norma que el árbol desmiente el día 1 es lo que §7.1
      del flujo prohíbe.
      DEUDA DECLARADA, no omisión (voto del autor, 2026-07-25): los dos sidecars JSON
      del caché de íconos —mesh_bounds.json e icons_meta.json, corpus_cargo_icons.lua
      client— SÍ son tablas de estado propio y SÍ caen adentro de la norma, y hoy no
      pasan por la primitiva. El motivo es del árbol: viven en data/corpus/cargo/icons/
      junto a los PNG que indexan, y el saneo de `key` bloquea el separador, así que
      Corpus.Data no puede direccionar una subcarpeta. Migrarlos hoy partiría el caché
      en dos lugares y MOVERÍA archivos, que es justo lo que la tanda que acuñó esta
      norma no hace. Se salda cuando la primitiva sepa direccionar el sub-namespace, o
      cuando el caché de íconos se rediseñe.
  COR-19:
    titulo: "El scope distingue config de servidor (sobrevive a borrar una partida) de estado de partida (muere con ella)."
    sede: "corpus/docs/CORPUS_Architecture.md §3"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: codigo, ref: "corpus-cargo/lua/corpus_cargo/server/corpus_cargo_capture.lua (autogen_defs) y corpus_cargo_icons.lua (icon_overrides) declaran scope = config; el resto de Cargo se queda en el default save" }
      - { tipo: selftest, ref: "corpus/lua/autorun/corpus_selftest.lua — bloque 2c: round-trip declarando config, los dos scopes resolviendo igual, y el scope desconocido que tira error" }
      - { tipo: harness, ref: "dev/harness_cargo.py — la purga con 'confirm' deja en pie el catálogo scope=config" }
      - { tipo: planilla, ref: "Corpus T2 — en juego (2026-07-25): el selftest del realm SERVER confirma el round-trip con scope config y que los dos scopes resuelven igual" }
      - { tipo: planilla, ref: "Corpus T6 — el catálogo scope=config sobrevive el reinicio del mapa" }
      - { tipo: planilla, ref: "Corpus T4 — el mismo bloque en verde en el realm CLIENT: el scope y las primitivas nuevas son shared de verdad, no solo de nombre" }
    nota: >
      SU EFECTO ES FUTURO Y SE DECLARA ASÍ, no se disfraza de efecto presente. HOY los
      dos scopes resuelven a la MISMA carpeta a propósito (el resolver de
      corpus/lua/autorun/corpus_data.lua): el gancho existe para que el ecosistema
      declare su scope sin que se mueva un solo archivo — blast radius cero sobre
      Caliber, Craving y el resto de Cargo. El layout de perfiles es un bloque
      posterior y solo toca esa función.
      POR QUÉ EL DEFAULT ES "save" y no "config": el estado de partida es la mayoría de
      los call sites y es el que se MUEVE el día que las rutas se separen; que el
      default sea el que se mueve deja del lado correcto, solo, al módulo que nunca se
      enteró de este parámetro. Un scope desconocido es un error() y no un silencio:
      es la clase de typo que hoy no se nota —las dos rutas coinciden— y que mañana
      manda un archivo a la carpeta equivocada.

