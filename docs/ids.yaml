    nota: "Acuñada el 2026-07-25 (B1). Deroga la forma 'un archivo por instancia' que §12 sostuvo hasta esa fecha: la medición sobre la data real dio 354 huérfanas sobre 370 archivos, todas estado de mundo que nunca debió persistirse. Cierra de paso roadmap #13 — Instances.Delete deja de hacer file.Delete y con eso desaparece la violación declarada de COR-3."
  CRG-57:
