    sede: "corpus/CLAUDE.md §Contratos que no debes romper · 9"
    fuerza: REGLA
    estado: VIGENTE
    evidencia:
      - { tipo: codigo, ref: "corpus_log.lua; el fallback MsgN del init de Caliber es la excepción declarada" }
    nota: "Acuñado el 2026-07-19 (voto D-11): la prosa vivía en el CLAUDE.md de Caliber (su contrato 6), que ahora la cita."
  COR-17:
    titulo: "Los assets de terceros no se versionan en el framework: el banco de sonidos default (sound/corpus/, ports de GAMMA) queda fuera de git; solo sus about.txt (documentación propia) se versionan."
    sede: "corpus/CLAUDE.md §Contratos que no debes romper · 10"
    fuerza: REGLA
    estado: VIGENTE
    evidencia:
      - { tipo: codigo, ref: "corpus/.gitignore — bloque «Assets: NO se versionan» (sound/** + !sound/**/about.txt), verificado con git check-ignore" }
