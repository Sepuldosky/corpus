  CRG-60:
    titulo: "El savegame guarda el MUNDO, no al jugador: el inventario del jugador no retrocede al cargar una partida."
    sede: "corpus-cargo/docs/Cargo_Architecture.md §12"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: codigo, ref: "corpus-cargo/lua/corpus_cargo/server/corpus_cargo_containers.lua — AdoptSavedState re-acuña el marcador que devuelve el savegame; ninguna ruta del bloque toca `inv_<steamid64>`" }
      - { tipo: harness, ref: "dev/harness_cargo.py — un ciclo entero de savegame del mundo no escribe una línea del record del jugador; y el blob del mundo solo tiene `items` (bloque B4)" }
      - { tipo: planilla, ref: "planilla Cargo, checks R1-R5 en 5/5 (2026-07-26, cuatro rondas) — la crate vuelve con su loot y con el sub-slot anidado, el trader con stock mermado y wallet, el drop `corpus_cargo_item` con su blob; R3 es el contraintuitivo: la mochila NO retrocede" }
    nota: "Acuñada el 2026-07-26 (B4). Es la contrapartida declarada de CRG-43: el inventario es por SteamID64 y sin noción de mapa, así que cruza de nivel en nivel Y de partida en partida. Ninguna línea la implementa —el record no es una entidad y no viaja por la cadena del duplicator— y ése es el punto: la norma existe para que nadie lo meta ahí y para que el tester no reporte como bug que su mochila no volvió. Decisión del autor de la misma tanda: cuando un contenedor con persistKey discrepa entre su archivo y el savegame, MANDA EL SAVEGAME (cont_<key> declara scope save — COR-19). Alcance medido en las rondas 3-4: la norma rige sobre las entidades SCRIPTEADAS de Cargo (crate, trader, el drop corpus_cargo_item), que vuelven con su tabla Lua completa. En el SWEP real que deja el drop de un arma la tabla no vuelve en absoluto, así que ese caso queda declarado y ACEPTADO por el autor en la fila de §13, no cubierto acá."

  CRG-61:
    titulo: "El import de un personaje está apagado por default y todo lo que llega del cliente se sanea server-side; es la única inversión de CRG-6 del módulo y va bajo llave."
    sede: "corpus-cargo/docs/Cargo_Architecture.md §12.1"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: codigo, ref: "corpus-cargo/lua/corpus_cargo/shared/corpus_cargo_lan.lua — la convar cargo_import_enabled nace en 0, el gate de admin, la whitelist donde vacía = nadie, el rate-limit y SanitizeRecord entrada por entrada" }
      - { tipo: harness, ref: "dev/harness_cargo.py — bloque B5: un import con la convar en 0 se rechaza (y también sin admin, fuera de whitelist, con formato viejo, con origen ajeno y por encima del tope); uno con una def desconocida descarta esa entrada y conserva el resto" }
      - { tipo: planilla, ref: "planilla Cargo, checks S1-S5 en 5/5 (2026-07-26, dos rondas) — S3 (convar en 0) y S4 (fuera de whitelist) son de RECHAZO y dejaron su línea de motivo en consola; S2 descartó una def desconocida y conservó el resto; S5 negativa" }
    nota: >
      Acuñada el 2026-07-26 (B5, entries 48-49 de Cargo). Es el único de los net.Receive
      de SERVIDOR del módulo que recibe ESTADO y no un intent: los otros 21 los protege
      CRG-6 —el server posee el inventario, un intent hostil se valida contra el estado real
      y no fabrica nada— y NET_ICON_OVERRIDE es el que espera gate y no lo tiene (CRG-45).
      La convar, el gate y la whitelist NO son adorno: son la condición de que la inversión
      sea aceptable, y bajar el default a 1 rompe la norma, no un valor. El receptor se
      registra SIEMPRE aunque la convar esté en 0 y descarta en la primera línea, porque un
      receptor que no existe no tiene dónde imprimir POR QUÉ rechazó — corolario directo del
      hallazgo de B4, donde el dato decisivo fue una línea de log que nunca imprimió.
      Decisiones del autor de la misma tanda: el import REEMPLAZA el record (con respaldo
      previo, destino primero como CRG-58) y el dinero viaja sólo con el provider nativo en
      AMBOS lados. Dos fronteras declaradas en §13: el gate de admin es LOCAL y provisional
      —espera la primitiva de permisos de CRG-45, y lo provisional es cómo se pregunta quién
      es admin, no la convar ni la whitelist—, y un arma equipada que llega en un import
      vuelve a la mano en el próximo respawn. El re-uid NO es código nuevo: reusa
      Instances.Remint (CRG-60). Y una medición reemplazó al chunking que el plan madre daba
      por hecho: un record pesado pero realista mide 15.770 bytes, así que lo que hace falta
      es un TOPE que rechace con motivo, no trocear. La planilla (5/5, dos rondas) agregó una
      corrección que la tanda había declarado mal: el import deja las armas equipadas EN LA MANO
      en el acto, corriendo Inventory.RegiveEquipped —la MISMA rutina del hook de spawn, extraída
      y nombrada, no una segunda ruta—; la fila de §13 que declaraba la espera del respawn como
      frontera aceptable desapareció porque el juego mostró que no lo era.

  CRG-62:
    titulo: "Cargo difunde que un slot de equipamiento cambió; la semántica de ese cambio vive en el consumidor, nunca en el inventario."
    sede: "corpus-cargo/docs/Cargo_Architecture.md §4"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: codigo, ref: "corpus-cargo/lua/corpus_cargo/server/corpus_cargo_inventory.lua — Corpus_Cargo_EquipChanged en Equip/Unequip/DropEquipped/RegiveEquipped y Corpus_Cargo_SubSlotChanged en SubSlotAttach/SubSlotDetach; el único oyente vive en server/corpus_cargo_nvg.lua" }
      - { tipo: harness, ref: "dev/harness_cargo.py — bloque #47: un oyente registrado recibe el slot y el def por CADA puerta, y la reversión de cada hook.Run pone en rojo el check que la nombra" }
      - { tipo: planilla, ref: "planilla Cargo, checks U2 y U3 en PASA (2026-07-27) — las gafas se ven al montarlas en el sub-slot del casco y al ocupar Head directo, que son las dos señales; y U6, que ejerce las mismas dos puertas desde el arrastre" }
    nota: >
      Acuñada el 2026-07-26 (roadmap #47). Es CRG-1 aplicado al equipamiento: hasta hoy
      Equip/Unequip solo daban y quitaban weapon_class y la única difusión era
      Corpus_Cargo_BodyChanged, exclusiva del slot body; los sub-slots no difundían nada.
      Sin esa señal no había dónde colgar una integración de equipamiento, y por eso el
      hueco era de Cargo y no del mod que lo destapó. Corpus_Cargo_BodyChanged sigue vivo
      y SIN CAMBIOS —su firma es contrato vivo del lector de disfraz del roadmap #10—: la
      señal genérica se dispara ADEMÁS, nunca en su lugar. Descartado con su razón escrita:
      def.onEquip/onUnequip en el contrato de ítem, que es más potente pero mete una closure
      por def en un contrato que hoy tiene exactamente una (onUse) y obliga a que 61 defs
      derivados carguen la misma función. Las PUERTAS son CINCO y no cuatro: el diseño contaba
      Equip/Unequip/SubSlotAttach/SubSlotDetach, y el árbol mostró que DropEquipped no pasa
      por Unequip —manipula rec.equip y difunde por su cuenta, como el BodyChanged existente
      ya hacía en sus dos salidas—; se suma también el reconciliador de WeaponDrop de
      capture.lua, que es donde se vacía el slot al soltar el arma en la mano. Y RegiveEquipped
      difunde con slotId nil, que significa "se re-aplicó todo": es la puerta del respawn, y
      existe para que un oyente con estado de jugador no tenga que enganchar PlayerLoadout y
      apostar al orden de hooks — el bug que Quick Loadouts ya le costó a este repo.
  CRG-63:
    titulo: "Un identificador de un tercero que sea POSICIONAL (un ordinal de su tabla) no se persiste jamás: se persiste su clave estable y el ordinal se resuelve en el momento de usarlo."
    sede: "corpus-cargo/docs/Cargo_Architecture.md §3"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: codigo, ref: "corpus-cargo/lua/corpus_cargo/shared/corpus_cargo_nvg.lua — el def lleva nvg_shortname y NVG.OrdinalOf resuelve contra ArcticNVGs_ShortNameToID en cada llamada; nada del ordinal llega a Items.Register" }
      - { tipo: harness, ref: "dev/harness_cargo.py — bloque #47: insertar una variante en el medio de la tabla stub CORRE el ordinal y el jugador sigue con las MISMAS gafas; y lo que llega a disco es el def id, no el número" }
      - { tipo: planilla, ref: "planilla Cargo, check U4 en PASA (2026-07-27) — tras cambiar de mapa las gafas equipadas siguen puestas y son la MISMA variante, no otra" }
    nota: >
      Acuñada el 2026-07-26 (roadmap #47). Mismo espíritu que CRG-42 (SWEP.Slot no es la
      señal): no persistir un dato que el tercero puede reordenar. El hecho que la origina
      está medido contra el código vivo del mod (CRG-24): ply:GetNWInt("nvg") guarda el ÍNDICE
      de ArcticNVGs, no un nombre, y el propio mod construye su índice inverso con `pairs`
      sobre un array (sh_arctic_nvg.lua:2583-2587) — dos razones para no tratar el ordinal
      como contrato. Un parche que inserte una variante en el medio corre todos los índices
      posteriores, así que un ordinal persistido es un ítem que un día amanece siendo otras
      gafas. Corolario que el mismo call site paga: el ordinal se VALIDA antes de escribirse,
      porque el mod no lo hace y un nombre inexistente baja a SetNWInt("nvg", nil), que es un
      error de argumento.
  CRG-64:
    titulo: "Un indicador de un estado ASÍNCRONO de un tercero pinta el TRÁNSITO; jamás pinta el estado viejo como si fuera el actual."
    sede: "corpus-cargo/docs/Cargo_Architecture.md §17.5"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: codigo, ref: "corpus-cargo/lua/corpus_cargo/client/corpus_cargo_lights.lua — el toggle del NVG lee el EquipDelay de la variante viva y abre la ventana de tránsito; el chip (corpus_cargo_wheel.lua, DrawLightChip) pinta borde amber + barra de progreso y NO afirma on/off durante la ventana" }
      - { tipo: harness, ref: "dev/harness_cargo.py — bloque #46: durante la ventana el estado del chip no es ni el viejo ni el nuevo (on = nil, transit con la duración del mod), y al expirar vuelve a la verdad de la NW" }
      - { tipo: planilla, ref: "planilla Cargo, check V2 — el chip del NVG no miente durante el segundo y pico del tránsito, con las gafas puestas por las DOS rutas de #47" }
    nota: >
      Acuñada el 2026-07-28 (roadmap #46, entry 53). Es la hermana de CRG-32 en el eje del
      TIEMPO: aquella prohíbe inventar un dato que no se tiene, ésta prohíbe afirmar uno que
      ya no vale. El caso que la acuña está medido contra el código vivo del mod (CRG-24):
      ArcticNVGs_Toggle (cl_arctic_nvg.lua:13-57) reproduce la anim de VManip y espera el
      EquipDelay de la variante (1,325 s en las GPNVG) ANTES de invertir nvg_on y avisar al
      server — un chip que pintara la NW mostraría el estado viejo más de un segundo. La
      duración jamás se hornea: se lee de la tabla viva del mod por variante, y es
      direccional — las 12 variantes `shades*` (las aviators) declaran UnequipDelay = 0.25 y
      las de tubo no, así que el apagado abre ventana o no SEGÚN LA VARIANTE. (Esta nota decía
      "ninguna variante declara UnequipDelay"; corregido el 2026-07-30 al re-derivarlo del mod
      — la 1.ª pasada del #46 leyó las GPNVG y generalizó de una muestra. La corrección ya
      estaba en la sede desde la ronda 3 de la planilla V y el registro se la había perdido;
      el código nunca compartió el error, porque siempre leyó variant.UnequipDelay con una
      rama por dirección.) La ventana rastrea solo el commit propio: un toggle disparado por
      la tecla del mod es invisible para el chip y se pinta como diga la NW (CRG-32: nada se
      inventa).
  CRG-65:
    titulo: "\"No entra\" nunca significa \"se destruye\": si un flujo le entrega a Cargo un objeto que ya sacó de otra parte y el inventario lo rechaza, el objeto cae al mundo como ítem."
    sede: "corpus-cargo/docs/Cargo_Architecture.md §4"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: codigo, ref: "corpus-cargo/lua/corpus_cargo/server/corpus_cargo_inventory.lua — Inventory.GiveOrDrop es la ruta única y devuelve si cayó al piso; sus dos consumidores son el hook ARC9_PlayerGiveAtt (shared/corpus_cargo_arc9.lua) y el sobrante del espejo del pool (server/corpus_cargo_ammopool.lua)" }
      - { tipo: harness, ref: "dev/harness_cargo.py — bloque CRG-65: con el grid al tope el objeto NO entra al grid y SÍ existe en el suelo, entero (el ledger); ídem para un unique, que cae con su blob acuñado; la ausencia (def desconocida no fabrica entidad); y el sitio real del pool, con las tres granadas en el piso" }
      - { tipo: planilla, ref: "planilla Cargo, sección AB check AB7 (2026-07-31) — el sitio del puente ARC9 es el único que el harness no puede ejercer (sus hooks se cablean dentro del OnReady, donde ARC9 es nil offline), así que se midió en juego: «bote el magazine de mi asval mod4 y se cayo tanto la municion como el item»" }
    nota: >
      Acuñada el 2026-07-30 (roadmap #53, decisión del autor). Es CRG-9 por la otra puerta: no
      un flujo que destruye un ítem con sub-slots ocupados, sino un flujo que destruye el ítem
      que le entregaron. La línea que la hace aplicable: RECHAZAR una acción y avisar es
      correcto (walk+use sobrecargado deja el arma en el suelo — de ahí no se sacó nada);
      CONSUMIR el objeto y avisar es el defecto, y solo esa forma pasa por GiveOrDrop. El
      aviso no es el remedio: un objeto que ya no existe no deja de no existir porque se haya
      impreso una línea. Los DOS sitios que la acuñan la violaban con un comentario encima
      afirmando lo contrario, lo que deja el corolario de verificación: el check que distingue
      no es "el grid no creció" —eso pasa igual si el objeto se evaporó— sino el LEDGER, ver
      el objeto existiendo en el suelo. Medido: revertir el sitio del pool deja en rojo
      exactamente ese check y los otros dos del bloque siguen verdes.

  CRG-66:
    titulo: "Lo que está acoplado a un ítem pesa, y pesa recursivamente; hoy el alcance vigente es el contenido de los sub-slots, y el árbol de attachments está DIFERIDO por decisión del autor."
    sede: "corpus-cargo/docs/Cargo_Architecture.md §5"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: codigo, ref: "corpus-cargo/lua/corpus_cargo/server/corpus_cargo_instances.lua — Instances.WeightOf recorre blob.subslots recursivamente y NO suma blob.atts (el comentario que cierra la función declara por qué, con el número que lo decidió); Instances.AttsWeight es la rama recursiva escrita y sin llamar, y es donde el filtro por categoría del #55 se enchufa. No hay una segunda suma de peso en ninguna parte" }
      - { tipo: harness, ref: "dev/harness_cargo.py — bloque #53(peso): el rifle pelado pesa 3 kg y con supresor (0,3) y mira (0,5) en el árbol SIGUE pesando 3, que es la decisión de la ronda 2; en paralelo AttsWeight suma 0,8 y baja por los hijos. O sea que lo diferido está medido COMO DIFERIDO y no como ausente — si alguien vuelve a enchufar la rama sin decidir el filtro, el primer check se pone en rojo" }
    nota: >
      Acuñada el 2026-07-30 (roadmap #53, decisión del autor) sobre un comportamiento que ya
      existía para sub-slots desde el Block 1: una placa montada en el chaleco y unas gafas en
      el casco YA pesaban. Lo que la vuelve norma es que el attachment de ARC9 le era invisible
      por UNA razón —no estaba en el blob— y que arreglarlo obligó a enunciar cuál era la regla.
      Corolario de forma: un tipo nuevo de cosa acoplable se suma dentro de esa recursión, no en
      una rama de peso propia. CASO DECLARADO Y NO CUBIERTO: la munición cargada en el arma —
      blob.clip1 es un número pelado que WeightOf no mira, así que hoy cargar un arma hace
      DESAPARECER peso del ledger (las balas salen del cinturón y no llegan a ninguna parte).
      Es entrada propia a propósito: aterriza en §16 (el cinturón ES el pool) y en la cadencia
      de recálculo del peso, no en el puente de ARC9, y mezclarlo haría que una planilla midiera
      dos cosas a la vez.
      ENMIENDA 2026-07-31 (planilla AB, ronda 2): el arbol de attachments NO entra todavia. El
      nominal plano de 0,3 kg por att no sobrevivio una build EFT real — el MCX 5.56 del autor
      pesa 2,9 kg y lleva DOCE attachments, o sea que las piezas pesarian mas que el arma. No es
      calibracion sino modelo: en EFT la mayoria de los slots llevan ESTRUCTURA (receiver, cañon,
      guardamanos, miras de hierro), que es el arma. Se difiere a decidir que CATEGORIAS pesan
      (roadmap #55, con la lista de STALKER GAMMA como referencia) en vez de bajarle el numero.
      Instances.AttsWeight queda escrita y probada offline, sin llamar desde WeightOf: la decision
      fue "todavia no", no "estaba mal".
      CIERRE 2026-07-31 (roadmap #56, entry 65): el "CASO DECLARADO Y NO CUBIERTO" de arriba —la
      municion cargada— dejo de estarlo y tiene norma propia, CRG-67, con sede en §16.10. Se
      resolvio como termino APARTE dentro de la misma recursion, no tocando esta: el #55 pesa el
      cargador como pieza y el #56 las balas adentro. La calibracion que los une queda dicha por
      adelantado: cuando el #55 aterrice, el peso de un cargador ampliado tiene que ser el del
      cargador VACIO o las balas se cuentan dos veces.

  CRG-67:
    titulo: "Una bala pesa lo mismo viva donde viva —cinturón, grid o cargador— y ninguna ruta la cuenta dos veces."
    sede: "corpus-cargo/docs/Cargo_Architecture.md §16.10"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: codigo, ref: "corpus-cargo/lua/corpus_cargo/server/corpus_cargo_instances.lua — Instances.ClipWeight, sumada dentro de WeightOf (la única recursión de CRG-66) como término aparte de AttsWeight; el peso por bala sale del def del ítem de munición vía Ammo.WeightPerRound, y no hay una segunda tabla de pesos por bala" }
      - { tipo: codigo, ref: "corpus-cargo/lua/corpus_cargo/shared/corpus_cargo_ammo.lua — Ammo.TypeOfClass resuelve el tipo HL2 de un arma SIN entidad viva (SWEP.Ammo trepando .Base con GetStored, después Primary.Ammo, después la tabla de escape de las armas del engine); un tipo que Cargo no maneja resuelve a nil y pesa 0" }
      - { tipo: codigo, ref: "corpus-cargo/lua/corpus_cargo/server/corpus_cargo_ammopool.lua — AmmoPool.SyncHeldClip al tope de Reconcile: el re-leído del cargador viaja en el poll de 4 Hz que ya corría, y va PRIMERO para que la recarga caiga en un solo Touch" }
      - { tipo: harness, ref: "dev/harness_cargo.py — bloque #56: la resolución del tipo con sus cinco formas (clase, herencia por .Base, Primary.Ammo de un no-ARC9, el placeholder 'none', el tipo no manejado), la tabla del engine, el caso del RPG (6 kg descargado / 9 cargado), LA IGUALDAD de conservación (30 balas pesan lo mismo en el cinturón que en el cargador) con su desigualdad de apoyo, la degradación honesta en cuatro formas, y la cadencia con su AUSENCIA — dos pasadas del poll sin mover el cargador cuestan cero Touch" }
    nota: >
      Acuñada el 2026-07-31 (roadmap #56, decisión del autor). Es CRG-14 llevado al peso: si el
      cinturón ES el pool, el cargador es el tercer bolsillo, y el costo de carga no puede
      depender de en cuál de los tres está la bala. El síntoma que la abrió: las mismas 30 balas
      pesaban 0,36 kg colgadas y 0 kg cargadas, o sea que recargar era un descuento, y con varias
      armas guardadas con el cargador lleno el jugador ganaba capacidad gratis. Medido en juego
      sobre el loadout real (planilla AC, dump de AC3): cinco armas escondían 1,588 kg.
      CORRECCION 2026-08-01 (check AC2 en FALLA): el ejemplo con el que esta norma nacio —"tres
      kilos enteros en el caso del RPG"— era FALSO y queda dicho en vez de borrado. El RPG de HL2
      NO TIENE CARGADOR: dispara de la reserva directo y su Clip1() contesta -1, asi que los
      cohetes siempre estuvieron en el pool y el pool sigue al cinturon, que siempre peso. El
      numero salio de multiplicar weight x max_stack del catalogo sin abrir el arma — una
      inferencia escrita como si fuera una medicion, en la premisa de la propia tanda.
      LA MITAD QUE COSTÓ INVESTIGAR NO FUE EL PESO SINO EL TIPO. §16.2 declara que el tipo real
      de un arma sale de su ENTIDAD y jamás del def, y sigue vigente: esto contesta el caso que
      esa regla no cubre —un arma guardada en el grid no tiene entidad— y lo contesta como
      DEFAULT DE CLASE, no como segunda verdad. El candidato obvio (Primary.Ammo) resultó FALSO
      para ARC9: está vacío en la clase porque SWEP.Primary.Ammo = SWEP.Ammo se evalúa al cargar
      la base, cuando SWEP.Ammo todavía es "" (shared.lua:334-335), y sólo Initialize lo corrige
      por instancia. Censo sobre dev/other/ (243 SWEPs, herencia resuelta): 215 caen en un tipo
      manejado, 10 en uno que no, y las 12 que no resuelven nada son exactamente plantillas base
      y melee — lo que no tiene cargador.
      LA CADENCIA ES DECISIÓN DEL AUTOR Y SE TOMÓ CON LOS COSTOS MEDIDOS, no estimados: recalcular
      el peso cuesta 1,5 us, pero el Touch que dispararía cuesta 0,158 ms de disco y ~1,7 KB de
      red, así que lo que había que racionar era el Touch. El refresco viaja en el poll de 4 Hz
      que YA corría: techo de cuatro Touch por segundo mientras se dispara y cero cuando no,
      contra los diez por segundo (64 KB/s a disco) de un Touch por bala.
      COROLARIO DE VERIFICACIÓN, y salió de una reversión: la propiedad "una bala se cuenta una
      vez" está protegida por DOS guardas independientes (el StoreClip adelantado del unload y el
      SyncHeldClip que encabeza Reconcile), así que bajar UNA sola deja el check en verde —
      medido, R5 dio cero rojos. El check no puede reclamar que prueba el ORDEN: prueba el
      RESULTADO, y hacen falta las dos guardas caídas para ponerlo en rojo.

