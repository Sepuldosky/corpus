  CRG-68:
    titulo: "El StatusPanel dibuja MAGNITUD, jamás significado: softMax/hardMax son data del registrante, y el exceso se pinta como tramado sobre la barra llena, nunca alargándola."
    sede: "corpus-cargo/docs/Cargo_Architecture.md §11.1"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: harness, ref: "dev/harness_cargo.py — bloque #59: 12 checks en CLIENT (los que la justifican son que 138 y 149 se dibujen DISTINTO con la barra igual de llena en los dos, y la DEGRADACIÓN en las dos direcciones) + 4 en el gate de FUENTES, entre ellos DOS controles negativos de esta misma norma —que el panel no ramifique por la identidad de una barra y que el spec no crezca un campo que nombre una consecuencia ajena— y uno POR CUENTA: el panel resuelve UN solo módulo, el propio. Ese va por cuenta y no por lista de nombres prohibidos, porque una lista pegada a mano cubre los módulos que existían el día que se escribió" }
      - { tipo: codigo, ref: "corpus-cargo/lua/corpus_cargo/client/corpus_cargo_statuspanel.lua — la aritmética en TRES funciones puras (BarFrac clampea a softMax, OverFrac, OverLabel) y NO dentro del Paint, a propósito: un PaintOver es una closure sin nombre y sin superficie que dibujar offline, así que meterlas de vuelta al Paint deja la norma sin poder medirse. El tramado en client/corpus_cargo_theme.lua — Theme.DrawHatch, que TOMA EL PANEL porque render.SetScissorRect trabaja en coordenadas de pantalla y surface.DrawLine dentro de un Paint en coordenadas de panel" }
      - { tipo: harness, ref: "VERIFICACIÓN EN NEGATIVO: los 14 sabotajes de la #59 dentro de dev/sabotaje_cargo_43_59.py, todos en rojo el 2026-08-21 (el que no podía faltar es devolver el clamp del poll a 0,100). Uno salió VERDE la primera vez y el hallazgo fue del GATE y no del parche: exigía la subcadena pelada `render.SetScissorRect`, que la línea de CIERRE del par satisface igual, así que borrar la APERTURA no bajaba ninguna cuenta — se corrigió nombrando el rect completo más una cuenta de 2 para el par (lección 114)" }
      - { tipo: planilla, ref: "Cargo AJ — dev/checks/cargo-sobrellenado-r1.html, CERRADA 7/7 el 2026-08-21 en UNA ronda (PASA 7, FALLA 0, SIN CORRER 0). La fila estrella cerró POR SU CRITERIO y no por el que se le parece —no «se ve el exceso» sino que los DOS números se vean DISTINTO—, y la nota del autor trajo los dos: «sí, se ve el rayado en rojo y +38; también el +49 en AJTEST». La DEGRADACIÓN también en verde: las cuatro barras que ya existían pintan exactamente igual que antes, que es lo que desbloquea a Craving sin acoplarlo. Y AJ7 confirma que la barra de prueba quedó DESMONTADA, así que no hay una barra fantasma «AJ Test» esperando en una ronda futura" }
    nota: >
      Acuñada el 2026-08-08, pedida por Craving (CRV-20: sus stats llegan a 150). Es CRG-1
      aplicado a la única superficie donde la tentación es real, porque acá el dato llega con
      una consecuencia pegada — el sobrellenado gobierna una probabilidad de vómito, y Cargo
      no sabe ni debe saber que el vómito existe.
      EL DEFECTO QUE ARREGLA ESTÁ MEDIDO, NO SUPUESTO (corpus_cargo_statuspanel.lua, poll de
      Build): hoy clampea a 0..100, así que 138 no desborda la barra — la deja LLENA Y MUDA.
      El jugador ve lo mismo con 100 que con 149, y con 149 la próxima mordida lo hace
      vomitar casi seguro. Es peor que un desborde: un desborde se ve. La primera redacción
      del §10 de Craving afirmaba que la barra se desbordaba; era una API ajena afirmada de
      memoria —lo que CRG-24 prohíbe— y se corrigió el mismo día al leer el archivo.
      Alargar la barra queda PROHIBIDO por la norma y no es cosmética: mentiría sobre qué es
      "lleno". Y el tramado se recorta con render.SetScissorRect (CRG-28). Degrada en las dos
      direcciones: registrante viejo sin los campos pinta como siempre; Cargo viejo ignora
      campos que no conoce. Ninguna mitad necesita saber la versión de la otra.

  # ── COA — Coagulant ─────────────────────────────────────────────────────────
  # El módulo mejor instrumentado del ecosistema: selftest + harness + seis rondas
  # de planilla con IDs (A/E/G/H/I). Es el ÚNICO con evidencia tipo planilla real.

  CRG-69:
    titulo: "El catálogo de ítems se recorre por la API pública (Items.GetAll / Items.ByCategory), y sale ORDENADO POR ID: `_defs` es un hash y su orden de `pairs` no se repite entre sesiones."
    sede: "corpus-cargo/docs/Cargo_Architecture.md §3"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: harness, ref: "dev/harness_cargo.py — 7 checks del accesor, entre ellos el del ORDEN sobre el catálogo entero, verificado en negativo borrándole el table.sort (2026-08-18)" }
      - { tipo: selftest, ref: "corpus-cargo/lua/corpus_cargo/shared/corpus_cargo_dev.lua — 9 checks en CADA realm: forma, frescura de la lista, defs por referencia y cruce ByCategory contra GetAll. ACREDITADO EN JUEGO el 2026-08-18: cargo_selftest 91 OK / cargo_selftest_cl 93 OK, 0 fallas, y los dos totales coinciden con los que el harness offline habia predicho" }
      - { tipo: codigo, ref: "corpus-cargo/lua/corpus_cargo/shared/corpus_cargo_items.lua — SortedDefs es el único recorrido público; los tres internos (dev, lan, iconeditor) siguen leyendo _defs porque viven adentro" }
    nota: >
      Acuñada el 2026-08-18. La pidió corpus-stalker: su trader de comida vende "todo lo que
      declare category = food" como REGLA y no como lista —para que una comida registrada
      mañana por cualquier addon entre sola—, y esa regla no se escribe sin recorrer el
      registro. `Items.Get` respondía por UNA def; los tres recorridos que existían (dev, lan,
      iconeditor) leen `_defs` directo porque viven ADENTRO del módulo, y STK-1 le prohíbe al
      consumidor agregar el accesor. Mismo movimiento que Trade.StockOf/HasViewer/ClearViewers:
      alcanzar la tabla privada desde afuera no evita el acoplamiento, lo muda.
      LA MITAD QUE NO ES OBVIA ES EL ORDEN, y es por lo que esto es INVARIANTE y no una firma.
      Sin `table.sort`, un trader que siembra stock recorriendo el registro arma un catálogo
      distinto en cada arranque SIN que nadie lo haya sorteado, y un defecto que dependa del
      orden no se reproduce dos veces: se lee como mala suerte, que es la peor forma que puede
      tomar. Con el orden fijo, lo único aleatorio que ve un caller es lo que el caller pidió.
      LO QUE LA MEDICIÓN CORRIGIÓ DE SÍ MISMA: el primer check de orden del harness comparaba
      DOS elementos y NO discriminaba — borrando el `table.sort` a propósito, el selftest se
      puso rojo y ese check siguió verde, porque con dos elementos un `pairs` sin ordenar
      acierta la mitad de las veces. Lo que juzga es recorrer el catálogo ENTERO (miles de ids
      ascendentes por azar del hash no pasa). Un caso suelto no juzga un orden.
      LO QUE NO DICE: nada sobre mutar el registro (no hay vía pública para desregistrar y esto
      no abre una), y nada sobre ocultar el catálogo bulk — esconder attachments y armas
      capturadas es decisión de DISPLAY y vive en el listado de dev; un accesor que descartara
      entradas mentiría sobre qué hay registrado.

  CRG-76:
    titulo: "UN FAVORITO ES UN FLAG DEL **JUGADOR** SOBRE UN ÍTEM, Y NINGUNA PUERTA QUE SAQUE ALGO DEL INVENTARIO PUEDE IGNORARLO. No es de la DEF —dos AK-74 de la misma def tienen que poder diferir, que es literalmente el caso de uso que lo pidió— ni de la CELDA. Vive en `rec.fav`, un set de claves del record, así que se persiste solo (§12). LA FORMA DE LA CLAVE ES EL DISEÑO: `unique` → `u:<uid>` (esa instancia), `stackable` → `i:<id>` (esa clase, todos o ninguno). El predicado tiene UNA casa, `Inventory.IsFavorite(rec, entry)`, y las CINCO puertas la llaman: vender (commit en server + el clic en cliente), «Move all», transferencia individual al contenedor, drop del grid y drop de un slot de EQUIPO. Ninguna re-lee el set — eso es lo que hace que la SEXTA puerta que alguien escriba tenga que venir a preguntar. La munición está EXCLUIDA, y se pregunta por `Items.CanFavorite` (shared) para que el menú del cliente y el rechazo del server no puedan derivar."
    sede: "corpus-cargo/docs/Cargo_Architecture.md §7.4"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: harness, ref: "dev/harness_cargo.py — bloque #43: 32 checks en SERVER (las CINCO puertas UNA POR UNA, la forma de la clave en sus tres formas incluida el uid pelado de `rec.equip`, el check que MIDE la decisión del autor —marcar, dejar que `AddStack` fusione y verificar que el resultado no queda ambiguo—, el `fav` por `EntrySnapshot` y su round-trip de persistencia, la poda con su control negativo de las claves de clase, y CUATRO controles negativos: la munición no se marca, lo NO favorito se sigue vendiendo, el «Move all» sí se lleva la munición, y desmarcar DEVUELVE las cinco puertas) + 40 en CLIENT (la estrella por `DrawPoly` con el abanico desde el centro, el toggle por su SITIO DE LLAMADA sobre el frame VIVO, el menú contextual y su control negativo sobre munición, y el clic de vender con su control negativo del LADO) + 5 en el gate de FUENTES, CUATRO de ellos POR CUENTA y por archivo separado" }
      - { tipo: codigo, ref: "corpus-cargo/lua/corpus_cargo/server/corpus_cargo_inventory.lua — `FavoriteKey`, `IsFavorite`, `PruneFavorites`, `ToggleFavorite` y las dos puertas de botar; shared/corpus_cargo_items.lua — `CanFavorite`; server/corpus_cargo_containers.lua (2 puertas) y server/corpus_cargo_trade.lua (1); client/corpus_cargo_trade.lua, ui.lua, grid.lua, tooltip.lua y theme.lua (`DrawStar`)" }
      - { tipo: harness, ref: "VERIFICACIÓN EN NEGATIVO: dev/sabotaje_cargo_43_59.py, 31/31 en rojo el 2026-08-21 (17 de la #43), con control de apertura y de cierre en verde. Los cinco primeros sacan el gate de UNA SOLA puerta cada uno: si alguno saliera verde, el control POR CUENTA no mide y la entrada se cae. Re-corridos sabotaje_cargo_67/68/69/74_72 (12/12, 16/16, 19/19, 28/28) porque la tanda tocó inventory/containers/trade/ui/grid — y DOS anclas viejas habían quedado en x0 y se actualizaron: el dedupe de refs del #67 (se indentó un nivel) y el cierre de `EntrySnapshot` del #68 (creció el campo `fav`)" }
      - { tipo: planilla, ref: "Cargo AI — dev/checks/cargo-favoritos-r1.html, CERRADA 13/13 el 2026-08-21 en UNA ronda (PASA 13, FALLA 0, SIN CORRER 0), y se acredita GESTO POR GESTO y no por cobertura: nueve de las trece traen la evidencia concreta en la nota. LAS CINCO PUERTAS se ejercieron una por una — el rechazo de vender salió POR ÍTEM y con el nombre adentro («Backpack is a favorite: unmark it before selling it», ídem «Large Backpack» y «RSh-12»), o sea que el gate resuelve la ENTRADA y no la sesión. EL MERGE (AI8) cerró con la aritmética a la vista: «tengo 4 vendas en favorito, una en el suelo; al tomar tengo 5, o sea se stackeó y no se puede botar ahora porque las 5 están en favorito» — 4+1=5 y las cinco marcadas, que es lo que la clave por clase promete y lo que un flag por celda no podía dar. La persistencia se midió con `retry` y volvió con sus DOS mitades (la conducta y la estrella dibujada). EL FALSO ROJO QUE SE PREDIJO NO OCURRIÓ: la nota de AI4 trae los dos avisos juntos —capacidad y favoritos— pero el gate vive ANTES del loop que prende `blocked`, así que un favorito no puede alcanzar esa bandera; el de capacidad fue un bloqueo real sobre ítems no favoritos. Queda dicho porque la próxima vez que alguien vea esos dos renglones juntos va a sospechar del candado" }
    nota: >
      Acuñada el 2026-08-21, roadmap #43, en tanda con la #59. DE DÓNDE SALE, textual del autor al
      diseñar la entrada el 2026-08-20: «que no pierdas los objetos que marcaste como favoritos,
      porque en el juego hay muchas armas que te pueden confundir y en una de esas puedes terminar
      vendiendo la tuya que siempre usas».
      POR QUÉ ES UNA NORMA Y NO UN PARCHE: el valor de la entrada no es que el candado exista, es que
      NO FALTE NINGUNA PUERTA. Un candado que cubre cuatro de cinco se ve exactamente igual que uno
      que cubre las cinco, y el jugador descubre cuál falta perdiendo el arma. Por eso el gate cuenta
      los SITIOS DE LLAMADA y no la existencia del helper (lección 89), POR ARCHIVO y no como total:
      con el total, mudar una puerta de archivo lo tapa —baja una y sube otra— mientras un archivo se
      quedó sin ninguna.
      LA DECISIÓN MÁS CARA, y es del autor (2026-08-21): un favorito de algo que APILA es POR ÍTEM y
      no por celda. `AddStack` FUSIONA sola —mismo id, misma condición, lugar bajo `max_stack`—, así
      que un flag que viviera en la celda queda INDEFINIDO en cuanto levantás otro del piso: o la
      entrada que entró no tiene flag, o cae en una celda no-favorita y el favorito se parte en dos
      mitades sin regla, y NO HAY ERROR NI AVISO en ninguno de los dos casos. Volverlo bien definido
      obliga a tocar el merge, que es la #73. Esta forma no lo necesita. El costo honesto, y se le
      dijo antes de que votara: no se pueden tener 3 vendajes favoritos y 2 no.
      LA MUNICIÓN EXCLUIDA es voto del autor y trae su motivo («la data de la municion es muy
      cambiante»). Es además él detectando, sin nombrarlo, el problema de identidad de arriba — pero
      excluir munición NO lo resuelve: los vendajes y la comida también apilan, y por eso la forma de
      la clave existe.
      EL «MOVE ALL» SALTEA EN VEZ DE RECHAZAR, y no es una copia de la puerta de al lado: cayendo por
      el rechazo, el bucle lo lee como `blocked` y anuncia «the container ran out of capacity» sobre
      una caja con lugar de sobra — el mismo falso rojo que el #67 ya pagó en ese receptor.
      LO QUE NO DICE: nada sobre el orden del grid (un favorito no sube ni baja de posición: eso es
      del `ord` de CRG-72 y del botón Sort), y nada sobre `BeltDrop` — el cinturón sólo acepta
      `category == "ammo"` y la munición está excluida, así que la cuarta puerta del espejo NO PUEDE
      ver un favorito. Va escrito porque «no aplica» y «se olvidaron» se ven igual.

  CRG-75:
    titulo: "TODA SUPERFICIE DERMA DEL MÓDULO SE ABRE POR UNA SOLA PUERTA — los menús por `CARGO.Theme.Menu()` y los cuadros de entrada por `CARGO.Theme.Prompt()`. **AMPLIADA el 2026-08-20 por el roadmap #75** (nació nombrando sólo los menús; la pasada en juego de la #74 dejó a la vista que el cuadro de «how much» era la MISMA norma con otra puerta, y se amplió el alcance en vez de acuñar un ID nuevo, porque dos IDs para «la UI del módulo pasa por el theme» es justo la duplicación que la norma existe para evitar). En su forma original:  ningún archivo llama a `DermaMenu()`, todos llaman a `CARGO.Theme.Menu()`. El helper pinta el panel, CADA fila, la flecha de submenú y el scrollbar, y envuelve `AddOption`/`AddSubMenu`/`AddSpacer` del menú que devuelve para que la DESCENDENCIA herede el tema — recursivamente, así que la norma no tiene una profundidad máxima tácita. Leer `T.Colors` es lo único que hace falta para tomar el acento de DGL4: la paleta ya deriva de él y muta EN SITIO (CRG-29), así que ir a buscar el acento al mod desde el menú sería una segunda casa."
    sede: "corpus-cargo/docs/Cargo_Architecture.md §15.7"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: harness, ref: "dev/harness_cargo.py — 22 checks del #74 (12 de CONDUCTA en CLIENT: que el helper devuelva un menú con Paint propio, que cada fila se pinte y tome el color de la PALETA VIVA por identidad de tabla, que el color se EMPUJE en cada frame y no una sola vez al crear —DLabel guarda el FG como snapshot—, la tipografía del módulo, el control negativo de la opción DESHABILITADA, el SUBMENÚ heredando el tema, su fila, su FLECHA, la recursión hasta el nieto, y EL SITIO DE LLAMADA de verdad: el menú que abre M2 sobre la celda del cinturón del frame VIVO; 10 en el gate de FUENTES, TRES de ellos POR CUENTA y por archivo separado). Total de la pasada 1038 -> 1089 con la #72. Los 11 sabotajes de la familia #74 verificados en NEGATIVO el 2026-08-20 con dev/sabotaje_cargo_74_72.py (20/20 la tanda entera), con control de apertura y de cierre en verde; y re-corridos sabotaje_cargo_67/68/69 (12/12, 16/16, 19/19) porque la tanda tocó ui/trade/transfer" }
      - { tipo: codigo, ref: "AMPLIACION #75: client/corpus_cargo_theme.lua — T.Prompt(), que envuelve Derma_StringRequest en vez de re-implementarlo (la funcion del engine posee el layout) y despacha por `panel.ClassName`; los DOS sitios en client/corpus_cargo_trade.lua y client/corpus_cargo_transfer.lua" }
      - { tipo: harness, ref: "AMPLIACION #75: dev/harness_cargo.py — 18 checks (11 de conducta en CLIENT, entre ellos que el Paint del campo DIBUJE el texto, el control negativo de que el mobiliario oculto del DFrame NO se pinte, y el control de alcance de que el cuadro siga devolviendo lo tipeado; 7 en FUENTES, dos POR CUENTA y por archivo separado). Pasada 1089 -> 1107. Los 8 sabotajes del #75 en rojo, con la tanda entera en 28/28" }
      - { tipo: codigo, ref: "corpus-cargo/lua/corpus_cargo/client/corpus_cargo_theme.lua — T.Menu(), SkinMenu, SkinMenuOption y PaintMenuArrow; los OCHO sitios de llamada en client/corpus_cargo_ui.lua (6), client/corpus_cargo_trade.lua (1) y client/corpus_cargo_transfer.lua (1)" }
      - { tipo: fuente-ajena, ref: "GMod garrysmod/lua/vgui/dmenu.lua + dmenuoption.lua + skins/default.lua, LEÍDOS EN DISCO. De ahí salen tres cosas que no se asumieron: que `DMenuOption:AddSubMenu()` construye el hijo con un `DermaMenu(true, self)` PELADO y AL DECLARARSE (no al abrirse, que es lo que decía el prompt de la tanda y era falso); que `DMenu:AddSubMenu` devuelve DOS valores (submenú y opción); y que el skin de fábrica decide hover y disponibilidad con `panel.Hovered || panel.Highlight` y `IsEnabled()`, que son las MISMAS dos señales que lee el helper, para que una fila tematizada no pueda contradecir a una sin tematizar sobre su propio estado" }
      - { tipo: planilla, ref: "Cargo AH (ampliacion #75) — **CERRADA el 2026-08-20, pasada en juego OK** (dev/checks/cargo-prompt-tema-r1.html). Las filas de COLOR por declaracion directa («los colores del menu contextual y de los StringRequest estan perfectos»); las DOS de conducta —que el campo muestre lo tipeado (AH3) y que aceptar transfiera (AH4)— por USO EXTENDIDO («varias horas» de juego), y se dice cual es cual. ⚠ Para AH3 ese uso es **mejor evidencia que un gesto unico**, y vale anotarlo como forma: si `DrawTextEntryText` faltara, el numero llegaria igual al server y lo unico visible seria la caja vacia al escribir — o sea que el defecto NO se manifiesta al final del camino sino solo mientras se tipea, y horas de comercio y saqueo no se sostienen con el campo en blanco." }
      - { tipo: planilla, ref: "Cargo AF — **CERRADA el 2026-08-20, pasada en juego OK** (dev/checks/cargo-menu-tema-r1.html). ⚠ **Declarada como BARRIDO y no fila por fila**, y se dice en vez de dejarlo entender: el autor escribió «Si esta bien el menu contextual ya revise todas y funciona como corresponde», o sea que las ocho filas quedan en PASA **por declaración**, no por ocho gestos con nota individual — precedente AE10-AE14, *un verde por cobertura y uno por gesto no son lo mismo y confundirlos deja deuda fantasma*. **Lo que la declaración SÍ cubre sin ambigüedad es lo único que el harness no podía cerrar solo**: que ningún menú quedara afuera de la norma, que era el riesgo real de la entrada (ocho sitios y CUATRO submenús, y un submenú gris no se ve sin abrirlo). Lo que NO quedó medido por gesto anotado es el control de teñido con DGL4 (AF6) frente al control sin DGL4 (AF7): el autor no reportó los dos presets, así que si algún día se sospecha del acento, esa fila se vuelve a correr."}
    nota: >
      Acuñada el 2026-08-20, roadmap #74, en tanda con la #72. DE DÓNDE SALE, textual del autor en
      juego el 2026-08-19 al llenar la planilla AD del #68: «tambien el menu contextual tiene color
      derma, deberia tomar el color del hud de DGL4 que tiene cargo».
      POR QUÉ ES UNA NORMA Y NO UN PARCHE, que es todo el valor de escribirla: el menú contextual era
      EL ÚNICO pedazo de UI del módulo que no pasaba por el theme —el frame, las celdas, el wheel, el
      tooltip y los chips ya derivan de CARGO.Theme— y son OCHO los sitios que abren uno. Pintarlos a
      mano deja el problema intacto: el noveno menú que alguien escriba vuelve a salir gris, que es
      exactamente cómo nació esta entrada. Mismo argumento que llevó el texto de condición a
      Theme.ConditionShort (#66), el criterio de orden a Items.AutoSortLess (#67) y la gradación a
      Grid.ClickAmount (#69).
      Y POR ESO EL CONTROL CUENTA LOS SITIOS DE LLAMADA Y NO LA EXISTENCIA DEL HELPER (lección 89):
      un gate que sólo pregunta si T.Menu existe deja pasar la reversión de UN menú a DermaMenu()
      pelado, porque los otros siete siguen midiendo. Las tres cuentas van POR ARCHIVO y no como
      total: con el total, mudar un menú de archivo lo tapa —baja uno y sube otro— mientras un
      archivo se quedó sin ninguno.
      EL COLOR DE TEXTO ES EL ÚNICO DEL THEME QUE SE EMPUJA EN VEZ DE LEERSE, y está dicho porque es
      la excepción a CRG-29 que podría leerse como un olvido: DLabel guarda el foreground como
      SNAPSHOT (UpdateFGColor copia la rgba al engine), así que una fila que lo seteara al crearse no
      vería NUNCA un re-teñido de DGL4 en vivo. El Paint lo re-empuja cada frame, que es lo que
      mantiene la propiedad cierta también acá.
      LO QUE ESTA ENTRADA NO TOCÓ: el CONTENIDO de los menús. Ni una opción movida, ni un AddSpacer
      agregado, ni un orden cambiado — es pintura, y un rojo de contenido se leería como un rojo de
      tema. La única excepción es el menú del CINTURÓN, y no es de esta entrada sino de la #72.
      LO QUE NO DICE: nada sobre el realce. El hover es `cellHover` y el borde `border` —lo mismo que
      una celda del grid— por voto del autor: el acento pleno en una lista de ocho opciones queda
      chillón. Si algún día se quiere teñido fuerte, es una decisión de paleta y se cambia acá, en un
      solo lugar, que es justo lo que la norma compra.
  CRG-74:
    titulo: "LA GRAMÁTICA DEL MOUSE, y vale para todo el módulo y no para una pantalla: M1 SELECCIONA, M3 DESELECCIONA, M2 es el MENÚ CONTEXTUAL. Los dos botones que mueven una cantidad leen los MISMOS tres niveles —pelado un cuarto del TECHO, SHIFT la CELDA que se apretó, ALT+SHIFT todo lo de ese ítem de ese lado— resueltos por UNA sola función (`CARGO.Grid.ClickAmount`), que es el único lugar del módulo que lee una tecla modificadora. Modificador ALT y nunca CTRL. Dos excepciones, las dos DECLARADAS: M3 no existe donde no hay nada seleccionado (el loot transfiere de inmediato), y en la FILA del basket M1 quita, porque una fila es una entrada de LISTA y no una celda."
    sede: "corpus-cargo/docs/Cargo_Architecture.md §15.6"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: harness, ref: "dev/harness_cargo.py — 53 checks del #69 (39 en CLIENT: los tres niveles con una celda cuyo count NO es el techo, los dos controles negativos de tecla suelta, las modificadoras derechas, el único, la def sin `max_stack`, el agregado y su ausencia; el LOOT ejercido POR SU SITIO DE LLAMADA —contenedor abierto de verdad, celdas del grid apretadas con `DoClick` e interceptando `Transfer.Send`—, las dos listas distintas para que el número delate un adaptador equivocado, M3 mudo en loot medido por CONDUCTA; los cuatro niveles de M3 sobre el basket con la línea borrándose a cero, el `DoMiddleClick` de la celda REAL en los dos lados, y las tres filas de la fila de la tira; 14 en el gate de FUENTES, SEIS de ellos POR CUENTA). Total de la pasada 985 -> 1038. Los 19 sabotajes verificados en NEGATIVO uno por uno el 2026-08-19 con dev/sabotaje_cargo_69.py: los 19 ponen la pasada en rojo, con control de apertura y de cierre en verde" }
      - { tipo: codigo, ref: "corpus-cargo/lua/corpus_cargo/client/corpus_cargo_grid.lua — Grid.ClickAmount (la casa única) y Grid.Aggregate, más el cableado de `cell.DoMiddleClick`, que se pone UNA vez y no en las tres superficies; client/corpus_cargo_trade.lua — Trade.ClickAmount y Trade.BasketTake (la mitad de M3, que no existía en ninguna pantalla) y la fila de la tira; client/corpus_cargo_transfer.lua — Transfer.ClickAmount, el adaptador del loot; client/corpus_cargo_ui.lua — las dos superficies del loot y el M3 del lado sell" }
      - { tipo: planilla, ref: "Cargo AE — **CERRADA 14/14, 0 fallas, el 2026-08-20** en DOS rondas (dev/checks/cargo-mouse-r1.html); la 1.ª quedó en 4 por cansancio del autor y no por un defecto. **AE2 cerró la única incógnita de la norma**: el botón del MEDIO llega a un DButton que además es Droppable — control positivo de M1 más `[AE2] M3 LLEGO` cuatro veces, o sea repetible —, así que lo que era indicio sobre la capa de drag-and-drop quedó MEDIDO EN EL MOTOR, que es exactamente lo que el harness no podía contestar. **Los repartos que trajo el autor miden, de yapa, lo que el bloque NO se propuso**: AE4 deja 77 en la caja y trae 30 (un cuarto del TECHO, no de la celda de 107); AE5 funde los 30 previos con las 77 en una celda de 107, que es AddStack bajo el techo; AE8 deja caja 120+120+17 e inventario 120+90, que SUMAN 467 — conservación intacta, y el 17 es el resto de re-empacar 257 bajo un techo de 120 y no munición mal partida. AE9 confirma los tres niveles en las DOS direcciones y los DOS lados del trato, con M3 replicándolos. **AE11 vio en juego el comportamiento declarado POR CONSTRUCCIÓN**: en la fila del carrito ALT+SHIFT saca lo mismo que SHIFT, porque una línea ya es el agregado de su ref. **OBSERVADO Y ACEPTADO**: arrastrar sigue moviendo el stack ENTERO en las dos direcciones (el autor lo llamó el símil de SHIFT+M1) — es por diseño, §15.6: el arrastre no es un clic. ⚠ **QUÉ SE MIDIÓ CON UN GESTO Y QUÉ POR COBERTURA, y se dice en vez de dejarlo entender**: las filas con reparto anotado (AE4, AE5, AE7, AE8, AE9, AE11) corrieron por su gesto y traen su número; **AE10, AE12, AE13 y AE14 se acreditan por el uso extendido del trader y por las filas que las cubren**, no por una corrida aislada — lo declaró el autor («no llené todas porque hay otras que me lo confirman»). Un verde por cobertura y uno por gesto no son lo mismo, y confundirlos deja deuda fantasma" }
    nota: >
      Acuñada el 2026-08-19, roadmap #69. DE DÓNDE SALE, textual del autor en juego al llenar la
      planilla AD del #68: «Al final como norma es que M1 selecciona, M3 deselecciona y M2 es el
      boton contextual». Las tres frases anteriores de esa nota —los cuartos por stack, el SHIFT+M1,
      el ALT+SHIFT+M1, y los tres niveles de M3 para deseleccionar— son CASOS de esa norma, y la
      norma es la entrada. Por eso el roadmap #69 dejó de llamarse «los contenedores: el clic debería
      transferir» y pasó a nombrar el módulo entero: la entrada nació de contenedores y terminó
      siendo la gramática de todas las pantallas.
      POR QUÉ ES UNA NORMA Y NO UN FEATURE, que es todo el valor de escribirla: la entrada existe
      porque dos pantallas del mismo módulo tenían dos gramáticas para el mismo gesto —en el trade un
      clic cargaba un cuarto desde el #67, en el loot mandaba el stack entero— y nadie lo decidió: se
      escribieron en tandas distintas y cada una eligió sola. Sin un ID que diga qué significa cada
      botón, la próxima pantalla vuelve a inventar la suya, que es exactamente cómo nació ésta.
      ALT Y NUNCA CTRL, y el motivo es del JUEGO y no de la UI (voto del autor, en juego 2026-08-19):
      CTRL está bindeado a agacharse, así que sostenerlo para comprar munición deja al jugador en
      cuclillas apenas se cierra el menú. Un modificador de menú no puede ser una tecla de
      movimiento. No se re-discute.
      EL CUARTO ES DEL TECHO Y NO DE LA CELDA, y tampoco es un detalle: tiene que ser el mismo bocado
      con una celda llena que con una de siete balas, o vaciar un stack casi vacío costaría los
      mismos cuatro clics que vaciar uno lleno. Una def sin `max_stack` no tiene techo y cae al
      agregado, que para un arma o un botiquín da 1 — la respuesta honesta para algo que no apila.
      LA CASA ÚNICA SE MIDE POR LA AUSENCIA DEL RESTO, y ésa es la parte que el harness tuvo que
      inventar: que `Grid.ClickAmount` exista no dice nada. Lo que hace que la gradación sea UNA es
      que ningún otro archivo lea una tecla, así que el gate cuenta los CUATRO únicos usos de
      `input.IsKeyDown(KEY_…)` del módulo entero y prohíbe el patrón en los otros tres archivos. Un
      segundo lector no revienta ni se ve: devuelve otro número y se desincroniza en silencio.
      Y LOS SITIOS DE LLAMADA SE CUENTAN, no se comprueban (lección 89 del catálogo): sabotear la
      gradación pone la pasada entera en rojo, pero devolver UNA de las cuatro superficies a su
      cantidad de antes la deja verde, porque las otras tres siguen midiendo bien. Dos de los 19
      sabotajes son exactamente eso y no tocan la gradación en absoluto.
      LAS DOS EXCEPCIONES SON VOTOS DEL AUTOR Y VAN ESCRITAS, no disimuladas:
      (1) M3 NO HACE NADA EN EL LOOT. La otra lectura era la transferencia inversa —M3 manda de
      vuelta, con los mismos tres niveles— y la rechazó por contraintuitiva: «jamás había visto un
      sistema así de inventario en juego donde tomes por transferencia inversa». La norma se lee
      entonces como «M3 deselecciona DONDE HAY ALGO SELECCIONADO», y en el loot la transferencia es
      inmediata: no hay carrito, así que «deseleccionar» no tiene referente. El camino de vuelta ya
      existe y es M1 sobre la otra columna, que es donde todo inventario lo pone.
      (2) EN LA FILA DEL BASKET, M1 QUITA. Es el único lugar del módulo donde M1 no agrega, y el
      motivo es que una fila es una entrada de LISTA y no una celda: existe sólo porque algo ya está
      seleccionado. Lo que la fila GANA son las cantidades, para que el vocabulario sea el mismo
      aunque el botón no lo sea. Y ahí ALT+SHIFT saca lo MISMO que SHIFT —la línea— porque una línea
      de basket YA ES el agregado de su ref (una por `RefKey`): no es un nivel que la fila no
      distingue, es el mismo número POR CONSTRUCCIÓN, y se declara así para que ningún check afirme
      distinguir dos cantidades que son una sola (la lección 94, al revés).
      EL COSTO, dicho ANTES de la pasada y no después: en el loot un M1 pelado pasa a mandar un
      cuarto, así que mover un stack completo son cuatro clics o un SHIFT+M1. Es lo que el autor
      pidió explícitamente, así que no es una objeción — pero es la pantalla que más se usa y el
      cambio se siente ahí.
      LO QUE NO DICE, para que nadie lo lea como permiso: nada sobre `Transfer.Menu`, el «enviar
      cantidad» del click derecho. El autor lo declaró bien como está («el enviar cantidad esta bien
      segun stack y como funciona actualmente») y su clamp `math.min(n, entry.count)` es una DECISIÓN
      del cliente coherente con «una celda es un stack» (#67), no una falla — es lo que hizo dar rojo
      a la fila AD11, que se retiró por premisa. Y no toca el `cid` de CRG-73: lo que una celda manda
      acá es una CANTIDAD, no una identidad, y los dos caminos que preguntan cuánto —el basket y la
      transferencia de contenedores— siguen agregando, con sus controles negativos verdes sin haber
      sido tocados.
      LA FRONTERA DECLARADA: el harness prueba que el `DoMiddleClick` de la celda está cableado y que
      hace lo que tiene que hacer, pero NO que el motor lo despache. La cadena se leyó en la FUENTE
      de GMod y no de memoria —`DButton` deriva de `DLabel` y `DLabel:OnMouseReleased` despacha
      `MOUSE_MIDDLE` a `DoMiddleClick`— y el grid no pisa ninguno de los dos handlers, pero que la
      capa de drag-and-drop del motor no se coma el press es indicio y no prueba. Por eso es la
      PRIMERA fila de la planilla AE: un cableado que no dispara se ve exactamente igual que una
      regla mal escrita. ⚠ Y queda como advertencia para quien toque la celda: el despacho es en
      `OnMouseReleased`, NO en pressed — pisar cualquiera de los dos sin re-emitirlo apaga M3 sin un
      solo error.

  CRG-73:
    titulo: "Una entrada del grid lleva un `cid` ESTABLE —acuñado una vez en el funnel del record, nunca reasignado, con contador persistido que sólo sube— y un ref de stack que lo trae resuelve a ESA celda y a ninguna otra. El arreglo es POR CAMINO: los cinco que MUEVEN una celda lo honran; los dos que preguntan una CANTIDAD siguen agregando. Un ref SIN `cid` sigue cayendo a la primera."
    sede: "corpus-cargo/docs/Cargo_Architecture.md §7.2"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: harness, ref: "dev/harness_cargo.py — 39 checks del #68 (25 en SERVER: los dos síntomas del autor con sus counts exactos y la conservación, los cinco caminos uno por uno, la compatibilidad del ref viejo y del record legacy, la celda perdida con su aviso, que el número no se recicle y que el contador sobreviva a disco, que el Sort no lo pise, QuickTarget, y los dos controles negativos del alcance; 8 en CLIENT: que RefOf lo lleve, que discrimine, que el único siga siendo `uid` pelado, y los controles negativos del basket; 6 en el gate de FUENTES, dos de ellos POR CUENTA). Total de la pasada 945 -> 985. Los 16 sabotajes verificados en NEGATIVO uno por uno el 2026-08-19 con dev/sabotaje_cargo_68.py: los 16 ponen la pasada en rojo, con control de apertura y de cierre en verde" }
      - { tipo: codigo, ref: "corpus-cargo/lua/corpus_cargo/server/corpus_cargo_inventory.lua — StampCid y StampEntries (el funnel, llamado por SaveRecord y BuildSnapshot), FindEntry con el conjunto del `cid`, FindCell (los cinco caminos), EntrySnapshot y QuickTarget; client/corpus_cargo_grid.lua — Grid.RefOf, el único sitio del cliente que arma un ref de stack" }
      - { tipo: juego, ref: "PASADA EN JUEGO ✓ 2026-08-19 (autor): los DOS síntomas del reporte cerrados — el cinturón se lleva la celda que se arrastra (84 balas de una celda menor al techo) y SIETE stacks de pistola dan SIETE ítems al botar, que es justo lo que el defecto impedía (el viejo recortaba contra la primera entrada y dejaba restos, o sea más ítems que celdas). cargo_selftest 100 OK y cargo_selftest_cl 107 OK, 0 fallas y clavados con la predicción offline. Las seis filas que quedaron SIN CORRER las cerró el mismo día la planilla AD (dev/checks/cargo-celda-r1.html): 12 PASA y 1 RETIRADO, los cinco caminos verdes uno por uno y la celda perdida contestando las dos mitades del voto. AD11 se RETIRA por premisa mal escrita y no es un rojo pendiente (precedente AB8/AC2): pedía 200 sobre una celda de 120 y el server sí derrama, pero la UI nunca ofreció ese gesto —Transfer.Menu anuncia 1-120 y clampea con math.min(n, entry.count)—, o sea que el criterio estaba escrito desde la capacidad del SERVER y redactado como un gesto de INTERFAZ. El mecanismo que esa fila protegía quedó verificado por su otra mitad: Move all mueve las 467 de las cuatro celdas con un solo ref deduplicado, que es justo lo que no pasaría si el campo nuevo se hubiera filtrado al contenedor. De la misma pasada, un comportamiento verificado que NO es de este bloque: sacar munición del cinturón rellena un stack del grid hasta max_stack (100+80 -> 120+60), que es AddStack desde el Block 1, y el autor lo cerró con el control correcto —botar ambos y medir la conservación" }
    nota: >
      Acuñada el 2026-08-19, roadmap #68. DE DÓNDE SALE, textual del autor en juego: «al meter al
      belt, ese que tiene 107 se mete otro de 120, incluso bote toda mi municion de pistola del grid
      y salieron 6 items de pistola en vez de los 4 que tengo en el grid». Y al confirmarle que el
      stack de 107 no era un bug, aclaró el pedido: «que en vez de mandar 120 de otro stack, se mande
      justo ese stack de 107 al belt».
      NO SE ESTABAN CREANDO BALAS, y decirlo primero es lo que ahorró la ronda: la conservación se
      cumplía y lo que no se cumplía era CUÁL entrada se movía. Los DOS síntomas del reporte son UN
      defecto —el ref traía `{ id, condition }` y `FindEntry` resolvía contra la PRIMERA que
      emparejaba—, y por eso los dos caen con el MISMO sabotaje.
      POR QUÉ NO ES EL `ord` DE CRG-72, que era la opción barata: el botón Sort reescribe todos los
      `ord` de una, así que un intent que nombrara un `ord` lo podía re-apuntar un re-orden que
      aterrizara entre el clic y el paquete. El `cid` se paga una vez y además paga la mitad del
      roadmap #70, donde un intent de arrastre tiene que decir «mové ESTA celda al slot 12».
      POR QUÉ NO ES UN BLOB POR STACK, que fue lo que el autor propuso: un blob existe para guardar
      HISTORIA (condición, attachments, clip1) y dos stacks de 9x19 no tienen ninguna que los
      distinga. Costaría un blob persistido por stack de munición en el record, rotación de `uid` en
      cada merge y cada split, y rompería el espejo cinturón-pool, que está construido sobre «N balas
      del tipo T». Arreglaría el síntoma pagando con un OBJETO DE PERSISTENCIA lo que resuelve un
      CAMPO.
      POR QUÉ EL CONTADOR VIVE EN EL RECORD Y SE PERSISTE, que es la parte que no se ve: derivarlo de
      «el mayor `cid` vivo más uno» reciclaría el número de una entrada que acaba de irse, y un
      número reciclado es exactamente lo que dejaría a un intent viejo disparar sobre una celda que
      el jugador nunca apretó — la falla que el campo existe para evitar.
      SE LLAMA `cid` Y NO `sid`, que es como lo nombró el roadmap, por una razón medida: `sid`
      significa SteamID en las 40 apariciones que tiene el módulo, cuatro de ellas en `GetRecord`,
      que es la función vecina de la que hospeda el campo.
      LA LECCIÓN DE MÉTODO DE LA TANDA salió del sabotaje 14 y es la única que costó una vuelta: el
      check de «el Sort no pisa el `cid`» estaba VERDE Y NO PODÍA FALLAR, porque en un grid recién
      nacido los `cid` coinciden con sus posiciones y pisarlos con la posición reescribe los MISMOS
      números. El arreglo fue darle churn al grid del check y dejarle una PRECONDICIÓN que lo delate.
      Un verde cuyo mecanismo no se ejercita no se distingue de un verde que sí.
      LO QUE NO DICE: nada sobre el basket del trade ni sobre la transferencia de contenedores. Ahí
      la semántica correcta es de CANTIDAD y no de celda, el agregado es lo que mantiene ALCANZABLE
      al stack gemelo (informe en juego 2026-07-14), y `MatchesRef` / `StackTotal` / `Trade.RefKey`
      ignoran el campo a propósito — con dos controles negativos en el harness que lo sostienen.
      Y tampoco dice nada sobre POSICIONES: el `cid` es una identidad, no una casilla; el nivel 2
      del grid sigue siendo el #70.
      LA FRONTERA QUE QUEDA DECLARADA, en vez de disimulada: un import LAN reconstruye las entradas
      de cero y su contador arranca de nuevo, así que un ref emitido antes del import podría
      teóricamente coincidir con un `cid` nuevo del mismo ítem. Requiere un import aterrizando entre
      un clic y su paquete; no se cierra y se deja escrito.

  CRG-72:
    titulo: "La POSICIÓN de una entrada en el grid es dato del JUGADOR y se persiste (`ord`); el criterio automático es sólo su estado inicial y un botón. Y una posición NO es una identidad: ningún ref de red nombra un `ord`, así que un re-sort no puede re-apuntar un intent en vuelo. ENMENDADA por CRG-73 el 2026-08-19 en su MITAD DE ALCANCE: la identidad de una entrada SÍ existe (`cid`) y sí viaja en los refs de los cinco caminos que mueven una celda; que dos stacks del mismo `id`+`condition` sean FUNGIBLES y que un clic nombre una CANTIDAD sigue valiendo, pero SÓLO donde la pregunta es cuánto — el basket del trade y la transferencia de contenedores."
    sede: "corpus-cargo/docs/Cargo_Architecture.md §7.2"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: harness, ref: "dev/harness_cargo.py — 31 checks del #67 (25 en SERVER: el techo de MaxStack y su piso de 1, el orden TOTAL de AutoSortLess, la siembra de un record legacy, que un pickup no mueva nada, que lo nuevo caiga al final, que el Sort sí re-escriba, que los DOS funnels estampen, el stock del trader partido y el falso bloqueo de Move all; 6 en CLIENT: las tres cantidades del clic y su control negativo) + 6 del gate de FUENTES, que aprendió a leer archivos de server/. Total de la pasada 910 -> 945. Los 12 sabotajes verificados en NEGATIVO uno por uno el 2026-08-19 con dev/sabotaje_cargo_67.py: los 12 ponen la pasada en rojo, con control de apertura y de cierre en verde" }
      - { tipo: codigo, ref: "corpus-cargo/lua/corpus_cargo/shared/corpus_cargo_items.lua — Items.MaxStack y Items.AutoSortLess, la única casa del techo y del criterio; server/corpus_cargo_inventory.lua — StampOrder (llamado por los dos funnels, SaveRecord y BuildSnapshot) e Inventory.SortGrid; client/corpus_cargo_grid.lua — el comparador que respeta `ord` y cae al criterio compartido; client/corpus_cargo_trade.lua — ClickAmount" }
      - { tipo: juego, ref: "PASADA EN JUEGO ✓ 2026-08-19 (autor): el botón Sort, el SHIFT+M1 sobre un stack y el «todo», los tres OK en el trader. Enmienda votada en la misma pasada: el «todo» pasa de CTRL+SHIFT a ALT+SHIFT, porque CTRL está bindeado a agacharse y un modificador de menú no puede ser una tecla de movimiento" }
    nota: >
      Acuñada el 2026-08-19, roadmap #67. EL AUTOR PIDIÓ DOS COSAS QUE PARECÍAN DOS FRENTES —que
      los ítems guarden posición, y que apretar sobre un stack de munición opere sobre ESE stack y
      no sobre las 800 balas de la mochila— y tenían la misma raíz: una entrada de stack no tiene
      identidad. LA MITAD DEL VALOR DE LA ENTRADA ES QUE ESA RAÍZ NO HABÍA QUE ARREGLARLA ENTERA:
      para el comercio la identidad resultó INNECESARIA, porque los stacks son fungibles y lo que
      un clic manda es cuánto y no cuál. Una función de cinco líneas en el cliente cerró ese
      frente; el `ord` quedó sólo para la posición, y no viaja en ningún ref.
      LA PREMISA DEL PEDIDO ERA FALSA Y MEDIRLO ES LO QUE ACHICÓ EL BLOQUE: «tal vez a la munición
      le falta información para separar stacks» — `AddStack` parte por `max_stack` desde el Block 1
      y las 800 balas YA eran siete entradas. Faltaba no volver a sumarlas al hacer clic.
      Y DE MEDIR EL ALCANCE SALIERON DOS DEFECTOS VIVOS Y SILENCIOSOS que nadie había pedido: el
      comparador del grid terminaba en `(a.uid or "") < (b.uid or "")`, que para dos stacks compara
      "" contra "" —empate total, y table.sort de Lua es quicksort y NO es estable, así que el x120
      y el x80 de la misma munición se cambiaban de lugar entre syncs sin que nada cambiara—; y
      Take all / Move all avisaba «no pude mover todo» sobre operaciones que habían funcionado
      enteras, porque la lista de refs traía uno por entrada, el primero se llevaba todo y los
      otros «no resolvían nada», que ese loop lee como bloqueado.
      LO QUE NO DICE: nada sobre gestión espacial. El nivel 2 (posiciones reales por celda,
      roadmap #70) enmendaría la mitad «sin gestión espacial» de la decisión del 2026-07-11, y esta
      norma no lo hace ni lo autoriza — sólo le saca al ORDEN el ser una función del contenido. La
      otra mitad de aquella decisión, «el costo de cargar es peso y no espacio», sigue intacta.
      LO QUE DECÍA Y YA NO: «TAMPOCO DICE que un ref pueda nombrar una celda: hoy no puede, y que
      `FindEntry` resuelva un ref de stack contra la PRIMERA entrada es un defecto abierto (roadmap
      #68)». Ese defecto CERRÓ el 2026-08-19 con CRG-73, que le da a la entrada un `cid` estable. La
      norma de acá arriba no cambia de contenido —el `ord` sigue sin viajar en ningún ref y el Sort
      sigue sin poder re-apuntar nada—; lo que cambia es que ya no se puede leer como «ningún ref
      nombra una entrada», porque ahora cinco caminos sí la nombran. Se dice explícito para que
      nadie lea la mitad «una posición no es una identidad» como permiso para volver a resolver un
      ref de stack contra la primera que empareje.

  CRG-71:
    titulo: "`def.uses` lee la condición 0-100 de un único como una UNIDAD (`n / uses`) y NO GUARDA UN SEGUNDO NÚMERO: el redondeo es TECHO, la ida y vuelta la cierran `Items.UsesLeft`/`ConditionForUses`, y a 0 el ítem QUEDA porque qué significa un gastado es del módulo dueño."
    sede: "corpus-cargo/docs/Cargo_Architecture.md §3"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: harness, ref: "dev/harness_cargo.py — 37 checks en SERVER (los dos portones del Register, los bordes del techo, la ida y vuelta sobre los 65 pares de 1..10 usos, el precio invariante, y los dos defectos de la tecla) + 15 en CLIENT (el texto de las dos formas y la cuenta del chip) + 6 del gate de FUENTES. Los 14 sabotajes verificados en NEGATIVO uno por uno el 2026-08-19: los 14 ponen la pasada en rojo" }
      - { tipo: selftest, ref: "corpus-cargo/lua/corpus_cargo/shared/corpus_cargo_dev.lua — 9 checks en server y 14 en cliente sobre cargo_dev_pills, SIN EFECTOS (gastar un uso muta un blob y un selftest en partida real no puede dejar ítems tocados). ACREDITADO EN JUEGO el 2026-08-19: cargo_selftest 100 OK / cargo_selftest_cl 107 OK, 0 fallas en los dos, y los dos totales COINCIDEN con los que el harness offline había predicho. Planilla dev/checks/cargo-usos-r1.html: 12 de 12" }
      - { tipo: codigo, ref: "corpus-cargo/lua/corpus_cargo/shared/corpus_cargo_items.lua — UsesOf/UsesLeft/ConditionForUses y los dos error() del Register; client/corpus_cargo_theme.lua — ConditionShort/ConditionLong, únicas que deciden el texto; server/corpus_cargo_inventory.lua — QuickTarget" }
    nota: >
      Acuñada el 2026-08-19, roadmap #66. LA MITAD DEL VALOR DE LA ENTRADA FUE NO ESCRIBIRLA:
      el pedido del autor ("el tooltip debería decir cuántos usos le queda, eso parece que le
      queda pendiente a Cargo") sonaba a una feature entera, y la barrita que describía YA
      ESTABA DIBUJADA hacía rondas — y el precio de un frasco a medio usar ya se partía al
      medio sin una línea escrita, porque sale de value × condición × spread. Lo único que
      faltaba era la UNIDAD. La lección se paga en la dirección contraria a la habitual: acá
      no faltó medir un defecto, faltó medir lo que YA ANDABA antes de diseñar encima.
      POR QUÉ ES INVARIANTE Y NO UNA FIRMA: porque lo que se defiende es que NO haya un
      segundo número. Alguien que "mejore" esto guardando los usos en el blob rompe cuatro
      cosas de una — el precio deja de derivar de la condición, la persistencia gana un campo,
      el round-trip deja de ser aritmética y pasa a ser sincronización, y CRG-7 (el stack se
      parte por condición) empieza a hablar de un dato que ya no manda.
      EL REDONDEO ES TECHO, y es un voto (autor, 2026-08-19). Lo que compra es la única línea
      que Cargo y el módulo dueño pueden acordar sin hablarse: 0 usos si y sólo si condición 0.
      Con piso, un frasco en 33,3 con uses=3 lee "0 usos" mientras todavía sirve y el jugador
      tira un ítem que funciona. El techo sólo puede errar hacia arriba y sólo si el dueño
      resta a mano — que es lo que ConditionForUses existe para evitar: restar 33 tres veces
      desde 100 deja 1, y el techo lee ese 1 como un uso inexistente. El epsilon de UsesLeft
      NO es cosmético: sin él la ida y vuelta falla en uses=7 (medido en el sabotaje).
      A CERO EL ÍTEM QUEDA, y está escrito porque el que consuma va a asumir lo contrario:
      es CRG-1 aplicado — qué es un frasco vacío (vendible, rellenable, basura) lo decide el
      dueño, no el inventario.
      DE PASO CERRÓ DOS DEFECTOS VIVOS Y SILENCIOSOS de la tecla rápida, que direccionaba con
      un `{ id = itemId }` armado a mano: un unique era inalcanzable (y se podía atar igual
      arrastrándolo, porque el gate de clase estaba sólo en el menú contextual — el Tourniquet
      de Coagulant lleva meses así) y un stack CON condición también, ése sin ni un Notice.
      Los dos son la misma forma: una ref construida a mano que sólo empareja una de las tres
      formas de entry que existen.
      Y EL GATE DE FUENTES DEL HARNESS SALIÓ DE ACÁ: verificando en negativo se midió que
      sabotear el helper ponía todo en rojo pero revertir el SITIO DE LLAMADA dejaba la pasada
      verde entera. Un helper impecable que nadie llama es un render viejo con un verde encima,
      y los closures de PaintOver no tienen nombre por el que agarrarlos desde Lua.
  CRG-70:
    titulo: "El ítem de una clase de arma se pide por Capture.ItemIdFor(class), que acuña la def autogen si nadie tuvo una en la mano — y lo que acuña, lo PERSISTE: lo que un trader vende, un jugador lo compra."
    sede: "corpus-cargo/docs/Cargo_Architecture.md §3"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: harness, ref: "dev/harness_cargo.py — bloque CRG-70: 14 checks (acuñación, PrintName trepando .Base, calibre desde la clase, comerciabilidad, idempotencia, los cuatro motivos exactos, la cara canónica del frag y la no-fantasma), los 8 gates verificados en negativo el 2026-08-18" }
      - { tipo: selftest, ref: "corpus-cargo/lua/corpus_cargo/shared/corpus_cargo_dev.lua — 5 checks en el realm SERVER: la mitad SIN EFECTOS (acuñar escribe en autogen_defs y un selftest en partida real no puede dejar ítems atrás). ACREDITADO EN JUEGO el 2026-08-18: cargo_selftest 91 OK, 0 fallas" }
      - { tipo: codigo, ref: "corpus-cargo/lua/corpus_cargo/server/corpus_cargo_capture.lua — CARGO.Capture.ItemIdFor; EnsureDef sigue siendo local y ahora resuelve nombre y calibre de la CLASE cuando no hay entidad viva" }
    nota: >
      Acuñada el 2026-08-18, un día después de CRG-69 y por el mismo consumidor. Es el MISMO
      agujero en otra superficie: la regla votada se podía escribir (CRG-69 destrabó recorrer el
      catálogo) pero las ARMAS no estaban EN el catálogo. Un arma capturada no tiene código
      propio —su def es autogen— y hasta hoy la acuñaba sólo la captura, cuando el engine
      entregaba el arma. `Trade.AttachTrader` resuelve cada línea de stock con `Items.Get`, no
      la encontraba, logueaba "stock desconocido" y salteaba EN SILENCIO: el trader vendía cero
      armas con el pack montado entero, y eso se lee exactamente igual que "el pack no está
      montado".
      LA MITAD QUE NO ERA OBVIA es la persistencia. `autogen_defs` existe (CHANGELOG #6) para
      que un arma capturada sobreviva al cambio de mapa; un arma COMPRADA necesita lo mismo, así
      que acuñar sin persistir dejaría al jugador con un blob cuyo id no resuelve. El efecto
      lateral queda declarado y no escondido: el catálogo pasa a ser "lo que los jugadores
      tuvieron en la mano Y lo que los traders sortearon".
      SÓLO ARMAS SCRIPTEADAS: las del engine no son SWEPs (GetStored da nil) y se rechazan con
      motivo — siguen capturándose por la vía del pickup, que tiene entidad viva. Y los cuatro
      motivos son contrato: una respuesta vacía sin causa es justo lo que CRG-69 advirtió.
      HALLAZGO DE INSTRUMENTO DEL MISMO PARCHE: la primera versión del tramo de rechazos era
      CIEGA y salió verificando en negativo — borrando el gate `Ignore` la pasada seguía verde,
      porque el check sólo exigía "rechazado con algún motivo" y la clase caía un gate más abajo
      (el de existencia) rechazándose igual. Un check que no mira CUÁL gate contestó no juzga
      ninguno: lo aprueba el de al lado. Se compara el motivo exacto y la clase de `Ignore` se
      siembra en el padrón para que el gate de abajo no pueda cubrirla.
