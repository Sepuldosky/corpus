      - { tipo: codigo, ref: "corpus-cargo/lua/corpus_cargo/server/corpus_cargo_containers.lua — Attach hidrata y Containers.Save renderiza, la misma rutina que corre el record" }
    nota: "Acuñada el 2026-07-25 (B1) con evidencia INTENCION: había un solo tipo de archivo de dueño (inv_<steamid64>) y nada la ejercía. B3 (2026-07-26) le dio el segundo —cont_<key>— y con eso deja de ser intención: los dos dueños serializan por la misma rutina (Instances.RenderOwner/HydrateOwner). El orden destino-antes-que-origen elige duplicar sobre perder: duplicar es el modo de falla seguro."
  CRG-59:
    titulo: "El estado del mundo no va a disco salvo dueño persistente declarado (`persistKey`)."
