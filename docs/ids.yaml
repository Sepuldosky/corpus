  CRG-58:
    titulo: "Una instancia nunca se referencia desde fuera del archivo de su dueño; el cambio de dueño MUDA el blob, escribiendo destino primero y origen después."
    sede: "corpus-cargo/docs/Cargo_Architecture.md §12"
