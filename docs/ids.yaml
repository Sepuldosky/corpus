# Referencia de Kontrol al backfillear: 159 INTENCION de 214 IDs (74%).
# ══════════════════════════════════════════════════════════════════════════════
salud:
  fecha: 2026-08-17
  # NO se escribe a mano: se COPIA de la corrida del checker (§7.7), que es quien cuenta.
  # El piloto del gate cazó este bloque con CUATRO cifras distintas para el mismo hecho
  # (178 acá, 43/178 en un PARCHE del CHANGELOG, 184 en el estado, 189 real): se editaba
  # a mano en cada tanda y nadie lo ratificaba. Es una norma que ENUMERA — se deriva del
  # árbol, no de la prosa (FLU-27). Y `por_familia` se quitó por la misma razón: era otra
  # lista a mano que se desincronizaba sola; el checker la imprime en cada corrida.
  total: 244
  intencion: 76          # 31% — la métrica que hay que bajar (§7.4)
  # Copiado de la corrida del checker del 2026-08-17 (sesión de diseño del DOLOR en Coagulant:
  # alta de COA-52, en INTENCION — no hay una línea de Lua que la ejerza y el porcentaje no se
  # mueve del 31%). Antes venía de la corrida del 2026-08-08 (enmienda §17 de Coagulant: alta de
  # COA-41..COA-48, las OCHO en INTENCION — es una sesión de DISEÑO y no hay una línea de
  # código que las ejerza; el porcentaje sube de 25% a 30% y eso es honesto, no un
  # retroceso: lo deshonesto sería acuñarlas con una evidencia que no existe). ESE SALTO
  # DE 218 A 240 NO ES TODO MÍO: la tanda metabólica del mismo día (COA-38/39/40, CRV-24)
  # tampoco refrescó este bloque, así que venía arrastrando drift — justo lo que el
  # comentario de abajo prohíbe, y van dos veces. Antes venía de la corrida del 2026-07-26
  # (roadmap #47, las NVG de Neosun como ítems: CRG-62 y CRG-63, ninguna INTENCION). Antes venía de la corrida del mismo día para B5 (216/55), y
  # antes de la del 2026-07-25 (213/56), que B4 no refrescó al acuñar CRG-60 — justo lo que
  # este comentario prohíbe: se copia en CADA tanda que toque el registro, no cuando alguien
  # se acuerda.
  referencia_kontrol: "159 INTENCION de 214 (74%) al backfillear"
  nota: >
    Línea base del barrido inicial: 27% de INTENCION contra el 74% con que arrancó
    Kontrol. La diferencia no es virtud, es que este ecosistema ya tenía tres capas
    de evidencia (selftest + harness offline + planilla en juego) antes de tener
    registro — lo que faltaba era poder CITARLAS. El grueso del INTENCION restante
    es FLU: normas de conducta que hoy nada observa salvo la disciplina. Bajar ese
