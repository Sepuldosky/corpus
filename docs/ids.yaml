      BAJADA A CÓDIGO el 2026-08-17 junto con §5.2 y NO con el resto de §2.1: §5.2 exige
      las dos constantes (sus tres ejes van en la misma banda) y §8 que los cinco getters
      devuelvan 0..150, así que el clamp entra con ese tramo y el VÓMITO (CRV-21) con el
      otro. VERIFICADA EN JUEGO el 2026-08-17 (planilla craving-nutrientes-r1, 14/14).
  CRV-21:
    titulo: "La probabilidad de vómito es ((sobrellenado)/50)² sobre el más desbordado de los dos stats, se tira UNA vez por consumo y revierte exactamente esa comida más 8 de hidratación."
    sede: "corpus-craving/docs/Craving_Architecture.md §2.1"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia: INTENCION
    nota: >
      Acuñada el 2026-08-08. El invariante que fijó el autor es el EXTREMO (100 % al llegar
      a 150); la curva la eligió el diseño: lineal lo cumple pero deja la banda inservible
      —con 130 ya tirás 60 % y nadie sobrecome nunca—, la cuadrática mantiene el muro y
      vuelve usable el tramo 100-130, que es donde vive la decisión. CONSECUENCIA ANOTADA
      PARA QUE NADIE LA DESCUBRA COMO BUG: 150 no es un estado alcanzable, es la pared donde
      el vómito es seguro; la banda que se sostiene es ~100-135. El vómito no es un no-op:
      revierte los cinco valores de esa comida y resta 8 de hidratación —lo único que puede
      dejarte PEOR que antes de comer—, la unidad ya la consumió Cargo, y suena (lo oyen los
      de al lado, como el estómago de §3: comparten convar). SIGUE SIN UNA LÍNEA DE CÓDIGO
      al 2026-08-17: es el tramo (a), y CRV-20 bajó sin él a propósito — el vómito revierte
      los CINCO valores de esa comida, así que escribirlo antes de §5.2 lo habría dejado
      escrito sobre dos y habría que volver a tocarlo. Con §5.2 ya en código se escribe UNA
      vez sobre cinco.
  CRV-22:
    titulo: "Los cinco valores metabólicos son explícitos por def: ninguno se infiere de otro, ni del kind, ni de los tags."
    sede: "corpus-craving/docs/Craving_Architecture.md §5.2"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: selftest, ref: "cobertura: las 15 defs propias declaran los tres y ninguna suma 0" }
      - { tipo: codigo, ref: "en juego 2026-08-17: los tres se mueven por def, ninguno sigue a otro" }
    nota: >
      Acuñada el 2026-08-08. Tercera vez que el módulo tropieza con lo mismo y primera que
      la regla queda escrita en general: el anti-desperdicio infería el stat de los números
      (lo arregló `kind`, §5.1), y la tentación acá era `energy = hunger`. La descartó el
      autor con una razón concreta y falsable: si energy es una vista de hunger, un shot de
      glucagón en Coagulant no tiene de qué agarrarse — un eje que no se puede mover solo no
      es un eje. Los tres campos nuevos son OPCIONALES con default 0 (un addon de terceros
      no puede romperse por una enmienda nuestra), pero las 15 defs propias los declaran
      todos y el harness lo verifica como COBERTURA, no como sintaxis: una def propia con
      los tres en 0 es un olvido, no una decisión. BAJADA A CÓDIGO el 2026-08-17: las 15
      declaran los tres y el check de cobertura exige suma > 0 (chequear el TIPO pasaría
      siempre, porque Register los defaultea). VERIFICADA EN JUEGO el 2026-08-17.
  CRV-23:
    titulo: "`tier` multiplica los tres nutrientes (junk 0.75 / standard 1.0 / quality 1.25) y NUNCA hunger ni hydration."
    sede: "corpus-craving/docs/Craving_Architecture.md §5.2"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: selftest, ref: "NutrientsOf deriva el efectivo del declarado; hunger/hyd intactos" }
      - { tipo: codigo, ref: "en juego 2026-08-17: junk ×0,75 y quality ×1,25 medidos; hunger/hyd intactos" }
    nota: >
      Acuñada el 2026-08-08. Es lo que saca a `tier` del limbo en que lo dejó §5.1 ("no
      gobierna nada todavía"). LA MITAD PROHIBIDA ES EL PUNTO DE LA NORMA, no un detalle:
      hunger e hydration están balanceados y verificados en juego desde julio, y meterles un
      factor retroactivo re-balancearía las 15 defs EN SILENCIO. El valor declarado es el
      contenido NOMINAL del alimento y `tier` dice si esta versión rinde mejor o peor que lo
      nominal; nadie compensa hacia atrás (no existe una def que declare 73 para terminar en
      55, que es lo que pasaría si el multiplicador entrara por el lado equivocado y alguien
      quisiera fijar el efectivo). Consecuencia buscada: la comida basura queda peor en los
      tres ejes pero sigue LLENANDO igual — llena el estómago y no alimenta.
      BAJADA A CÓDIGO el 2026-08-17: Food.TIER_MULT vive pegado a Food.TIERS (son el mismo
      vocabulario cerrado) y Food.NutrientsOf es el ÚNICO lugar donde el tier multiplica.
      VERIFICADA EN JUEGO el 2026-08-17 con los DOS extremos y el número exacto: cola (junk)
      dio energy 41,2 sobre 55 declarados y salchicha (quality) 25,0/43,8/15,0 sobre 20/35/12,
      con hambre e hidratación moviéndose SOLO lo declarado.
  CRV-24:
    titulo: "Craving publica números crudos y no interpreta clínicamente: acá no existe el concepto de déficit, ni su umbral, ni su efecto."
    sede: "corpus-craving/docs/Craving_Architecture.md §5.2"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: selftest, ref: "GetMetabolic: tabla nueva por llamada, escribirla no pisa el estado" }
      - { tipo: codigo, ref: "en juego 2026-08-17: los cinco crudos, mismo valor en los dos realms" }
    nota: >
      Acuñada el 2026-08-08. Contraparte exacta de COA-38/COA-40: el umbral de déficit vive
      en la config de Coagulant, no acá. Es la frontera de siempre leída al derecho — el
      número es supervivencia, la consecuencia es medicina — y es lo que hace que la
      excepción de dirección (CRV-13) no se convierta en fusión de dominios. Corolario de
      implementación que la vuelve exigible: GetMetabolic devuelve una tabla NUEVA en cada
      llamada, jamás la interna; con la tabla por referencia, "Coagulant solo lee" sería una
      convención que nadie puede hacer cumplir. Contrapartida asumida: aloca, así que nadie
      la llama en un Paint — el consumidor que dibuja la cachea en su refresco de vitales.
      BAJADA A CÓDIGO el 2026-08-17, en los DOS realms (server lee el estado, cliente el
      espejo NW2). VERIFICADA EN JUEGO el 2026-08-17: los dos realms imprimen los mismos cinco.

