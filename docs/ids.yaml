  V: "ídem P — sexta sección de planilla de Cargo (V1-V9), roadmap #46: las luces en el wheel (el tercer grupo de chips — linterna por intent propio, NVG con tránsito CRG-64, dispositivos ARC9 por ToggleStat/PostModify, el empuje de anclaje y la negativa de ausencia). Registrada ANTES de usarse (FLU-30), en el mismo parche que la acuña (entry 53); nació con seis checks y la planilla entregada le sumó V7-V9, los candidatos del USO, sin reciclar números (FLU-07 — la lección de #47: la planilla mide lo que se propuso medir, el uso mide lo que falta; V7 lleva además la medición pendiente de la diferida (h)). Es la otra mitad del frente de #47: aquella planilla midió POSEER, ésta mide ACCIONAR"
  W: "ídem P — séptima sección de planilla de Cargo, roadmap #48: la celda ancha del grupo de luces (la diferida (g) del #46, con el bloque 06 del mock como sede) — la celda ancha con anclaje left y con right, la DEGRADACIÓN sola a 56×56 con top/bottom en el mismo build, el empuje compartiendo lado, la negativa con la convar en 0 y la superficie del #46 intacta. Registrada ANTES de usarse (FLU-30), en el mismo parche que escribe la celda. Cerrada **10/10 el 2026-07-29 en dos rondas**. Nació con siete (W1 la medición + W2-W7 el paso 1) y la 2.ª ronda le sumó W8-W10 para el click, **sin reciclar números** (FLU-07). W3 y W6/W10 son los de ausencia y negativa. Dos cosas quedan dichas: los seis del paso 1 pasaron **sin nota** —la regla del #46 no se ejercitó, y el hueco que dejó (la resolución de pantalla de W4) lo cerró el autor después: **16:9**, con el 4:3 declarado y sin medir—; y **W1 costó una ronda por el INSTRUMENTO y no por el motor**, porque la primera sonda contaba los clicks pero no dibujaba nada. La lección de método de la sección: el hallazgo salió de **revertir el arreglo**, no de la corrida verde — **la reversión es el único instrumento que audita al instrumento**"
  AI: "ídem P — decimonovena sección de planilla de Cargo, roadmap #43 / CRG-76: los favoritos. Registrada ANTES de usarse (FLU-30). Sigue a la AH por FLU-07. **Su forma la fija lo que la entrada vale: no que el candado exista, sino que NO FALTE NINGUNA PUERTA**, así que tiene una fila POR CADA UNA DE LAS CINCO —vender, «Move all», transferencia individual, drop del grid y drop de EQUIPO— y el jugador tiene que INTENTARLAS DE VERDAD. Un gate que cubre cuatro de cinco se ve exactamente igual que uno que cubre las cinco, y la diferencia se descubre en el juego, perdiendo el arma. **La fila que la planilla existe para correr es la del MERGE**: marcar favoritos los vendajes, levantar más del piso y ver que la marca sigue valiendo — es la decisión más cara de la tanda (el flag es por ÍTEM y no por celda, voto del autor 2026-08-21) y el harness la mide sobre el record, pero el gesto de levantar algo del piso pasa por la captura del mundo, que es de juego. **Tres filas son CONTROLES NEGATIVOS y son las que separan «el candado funciona» de «el inventario se rompió»**: que un ítem NO favorito se siga vendiendo/botando/transfiriendo igual que antes, que la MUNICIÓN no se pueda marcar (y que el cinturón del #72 siga andando), y que DESMARCAR devuelva las cinco puertas — un candado sin llave es un bug, no una protección. **Dos filas son de UI y no de conducta**: la estrellita del tooltip a la derecha del peso sobre un ítem de NOMBRE LARGO (el reserve de esa fila ya pagó un defecto de espacio en el #66, y la estrella aparece sólo en algunos ítems, que es la forma de bug que se ve bien hasta que no) y el toggle ★ al lado del Sort, que el autor eligió sobre una novena tab con el ancho MEDIDO delante: las ocho tabs de hoy suman 454 px contra los 424 de la barra a 1280×720, o sea que `Misc` ya wrapea, y acortar el label no cambia nada en ninguna resolución. **CERRADA 13/13 el 2026-08-21 en UNA ronda**, y acreditada GESTO POR GESTO —nueve de las trece con la evidencia concreta en la nota— y no por cobertura, que es lo que la distingue de la AH. **La fila que la planilla existía para correr, el MERGE, cerró con la aritmética a la vista**: 4 vendas favoritas + 1 levantada del piso = 5, las cinco marcadas y ninguna botable. **El falso rojo que se había predicho para el «Move all» NO ocurrió** y la respuesta fue de lectura de código, no de otra ronda: el gate vive ANTES del loop que prende `blocked`, así que el aviso de capacidad que salió junto al de favoritos era un bloqueo real sobre ítems no favoritos. **Y su hallazgo salió de la NOTA de un check que PASÓ** (AI5, octava vez en el arco): el grid del jugador DENTRO del loot no ofrece ni marcar favorito ni botar, porque abre `Transfer.Menu` —sólo los verbos de transferencia— y no el menú del grid del inventario; es el roadmap #76 y no un defecto de esta entrada."
  AJ: "ídem P — vigésima sección de planilla de Cargo, roadmap #59 / CRG-68: la marca de sobrellenado del StatusPanel. Registrada ANTES de usarse (FLU-30). Sigue a la AI por FLU-07. **Es la hermana chica de la tanda y su diseño no tenía nada que decidir** (cerrado el 2026-08-08 en `Cargo_Architecture.md` §11.1): lo que la planilla cierra es la bajada. **La fila que la sección existe para correr es 138 CONTRA 149**, y el criterio es que se vean DISTINTO — no que «se vea el exceso». Ése es el defecto exacto que la entrada cierra: el clamp viejo dejaba la barra LLENA Y MUDA, así que el jugador veía lo mismo con 100 que con 149, y con 149 la próxima mordida lo hace vomitar casi seguro. Es peor que un desborde: un desborde se ve. **La otra fila que no puede faltar es la DEGRADACIÓN**: una barra registrada SIN los campos nuevos —las cuatro que existen hoy— tiene que pintar IDÉNTICA que antes, y es lo que desbloquea a Craving sin acoplarlo. **Y una de CONTROL NEGATIVO de CRG-68**: el exceso se pinta TRAMADO ENCIMA de la barra llena y la barra NO se alarga, porque una barra que crece más allá de su marco miente sobre qué es «lleno». **CERRADA 7/7 el 2026-08-21 en UNA ronda.** La fila estrella cerró **por su criterio y no por el que se le parece**: la nota del autor trajo los DOS números —«se ve el rayado en rojo y +38; también el +49»— y no sólo el rayado, que era la mitad que se advertía que suele faltar. **Ninguna nota abrió nada**, que es lo esperable de una entrada cuyo diseño había cerrado trece días antes y cuya bajada no tenía que decidir nada."
  AM: "ídem P — vigesimotercera sección de planilla de Cargo, roadmap #65: cerrar la pantalla de trade desde el server. Registrada ANTES de usarse (FLU-30). Sigue a la AL por FLU-07. **Cubre SÓLO la #65 y eso es una decisión del autor**: la #60 (`AreaHas`/`AreaCount`/`AreaTake`/`AreaTakeUnique`) queda escrita y **con su pasada en juego DIFERIDA hasta que exista el área hospital de Coagulant**, porque su único consumidor todavía no bajó a código y una planilla sobre un llamador que no existe mide el harness otra vez, no el juego. **La fila estrella NO usa la consola y ése es el punto**: se spawnea al **Sidorovich** de corpus-stalker, se le abre el trade y **se lo mata con la pantalla abierta** — que es textualmente la deuda que su header declara desde hace meses («queda huérfana y el jugador la cierra a mano»), y ejercita al **consumidor real** a través del helper perezoso `TradeAPI(\"ClearViewers\")` en vez de un andamio. **`CloseFor` sí va por consola y se dice por qué**: es superficie nueva y todavía no tiene llamador en juego — el trader de corpus-stalker expulsa con `ClearViewers`, no de a uno. **Una fila es CONTROL NEGATIVO y es la que reemplaza a un guard que se borró**: con el **inventario solo** abierto, matar al trader NO tiene que cerrarlo; el guard que protegía eso vivía en `CloseIfOpen` y era inalcanzable, así que la protección se mudó al receptor y ésta es la fila que lo acredita en pantalla. **Y una es de ALCANCE**: que el comercio normal siga andando punta a punta, porque `ClearViewers` cambió de comportamiento y su modo de falla es no romper nada visible del lado del server."
  AL: "ídem P — vigesimosegunda sección de planilla de Cargo, TANDA TRIPLE: roadmap #58 (el tooltip mostraba el peso pelado del def), #77 (la afirmación falsa del comentario de las tabs) y #78 (al círculo de herramienta le faltaba el favorito). Registrada ANTES de usarse (FLU-30). Sigue a la AK por FLU-07. **Van juntas porque las superficies son DISJUNTAS** —el peso vive en el snapshot y el tooltip, la fila de tabs es un comentario en `shared`, y el círculo es un menú de `ui.lua`— así que un rojo de una no se puede confundir con un rojo de otra, y cada una tiene su bloque de sabotaje para poder cerrar sola. **La #77 no aporta ninguna fila y se dice**: es sólo un comentario que prometía lo que el código no cumple, no tiene superficie en juego, y se acredita por lectura. **Lo que la sección tiene que separar en la #58 es «el número cambió» de «el número es el MISMO en las cuatro pantallas»**, y por eso hay una fila que mira el mismo rifle en la mochila y adentro de la caja: mandar el peso desde un solo sitio de wire habría dejado 9 kg en una ventana y 6 en otra, que es un defecto PEOR que el original porque el número pasaría a depender de qué ventana abriste. **Dos filas son CONTROLES NEGATIVOS y son las que impiden que un `SnapWeight` que devuelva siempre algo se lea como correcto**: un arma DESCARGADA tiene que seguir mostrando exactamente lo de antes, y un stackable también. **La #78 salió de un CENSO y no de un rojo** —el de los ocho menús contextuales del módulo, que la #76 sugirió—, y su fila estrella no es que la opción exista sino que el círculo dejó de ser la única pantalla que te mostraba la estrella en el tooltip, te rechazaba el Drop pidiendo que la quitaras, y no te daba dónde."
  AK: "ídem P — vigesimoprimera sección de planilla de Cargo, roadmap #76: el grid del jugador dentro del loot (y del trade) no tenía las acciones básicas. Registrada ANTES de usarse (FLU-30). Sigue a la AJ por FLU-07. **Nació de la NOTA de AI5, un check que PASÓ** — octava vez en el arco de Cargo, y por eso la sección existe: el hueco no lo encontró un rojo. **Lo que la planilla tiene que separar es «la fila está» de «la fila hace lo que dice»**, y son dos cosas distintas sobre la misma celda: es el único menú del módulo donde «Move» y «Drop» caen uno al lado del otro, o sea dos DESTINOS a un pixel de distancia, así que hay una fila que aprieta Drop dentro del loot y va a MIRAR EL PISO — un «Drop» cableado a la transferencia se ve idéntico en el menú, corre sin un error, y el ítem aparece en la caja. **La fila que la sección existe para correr es la del TRADE, y no está en el reporte del autor**: él lo pegó sobre el loot porque ahí lo vio primero, pero la medición encontró que en la pantalla del trader el hueco era PEOR — un `unique` agrega siempre 1, así que el atajo `avail <= 1` mandaba el M2 derecho al basket y, siendo favorito, derecho al mensaje que le dice que vaya a desmarcarlo. **La ventana que emite la instrucción era la única que no la podía cumplir.** **Dos filas son CONTROLES NEGATIVOS de alcance**: que la columna del CONTENEDOR siga siendo sólo transferencia (lo que está en la caja no es tuyo todavía, y el ref de `favorite`/`drop` nombra una celda de TU record) y que el menú de SOLO no haya perdido nada al unificarse — se unificó el CONSTRUCTOR y no el CONTENIDO, así que «Equip on…» y «Quick bind…» siguen existiendo en el inventario y NO aparecen sobre una caja. **Una fila es de UI pura y es la que el harness sólo puede medir por posición**: que el separador siga ahí y que sobre MUNICIÓN sea uno solo y no dos, porque la munición no lleva fila de favorito y dos rayas pegadas sobre ese hueco no se leen como «no hay nada que separar»."
  AH: "ídem P — decimoctava sección de planilla de Cargo, roadmap #75: el cuadro de «how much» toma el tema. Registrada ANTES de usarse (FLU-30). Sigue a la AG por FLU-07. **Es la hermana chica de la AF y mide la MISMA norma en su segunda puerta** (CRG-75 ampliada), así que su valor está en las dos filas que la AF no puede tener. **La primera es la que no se ve como un color equivocado sino como «no hay texto»**: el texto de un `DTextEntry` lo dibuja el SKIN y no el engine (`skins/default.lua` PaintTextEntry termina en `panel:DrawTextEntryText`), así que un `Paint` propio que se olvide de esa llamada deja una caja donde se puede tipear y no se ve nada — la fila es literalmente TIPEAR UN NÚMERO Y VERLO. Se leyó en la fuente antes de escribir el helper, o sea que la fila nace como confirmación y no como caza. **La segunda es el control negativo del mobiliario**: los tres botones de ventana del `DFrame` están ocultos acá (`Derma_StringRequest` llama a `ShowCloseButton(false)`) y pintarlos los haría aparecer, así que la fila mira que la barra de título siga VACÍA. Y una tercera de alcance: que el cuadro SIGA FUNCIONANDO — el helper envuelve el diálogo entero, así que podía romper el callback sin cambiar un solo color."
  AF: "ídem P — decimosexta sección de planilla de Cargo, roadmap #74 / CRG-75: el menú contextual toma el tema (todo menú del módulo se abre por `CARGO.Theme.Menu()`). Registrada ANTES de usarse (FLU-30). Sigue a la AE porque el alfabeto de una letra se agotó en la Z y no se recicla ninguna (FLU-07). **Es una planilla de PINTURA, y por eso casi todas sus filas se miran en vez de leerse**: un `Paint` es una closure sin nombre y sin superficie que dibujar offline. Lo que el harness SÍ pudo contestar —y es más de lo que la entrada prometía— es la conducta de la closure: se la invoca y se mira qué decidió, porque el stub de vgui se derivó de la FUENTE de GMod leída en disco (`vgui/dmenu.lua` + `vgui/dmenuoption.lua`) en vez de nuestra prosa. **La fila del SUBMENÚ es la que la planilla existe para correr**: un `DMenu` hijo lo construye `DMenuOption:AddSubMenu()` con un `DermaMenu(true, self)` PELADO, o sea un menú APARTE que el helper nunca vio, así que un helper que pinte la instancia y no la descendencia deja los CUATRO submenús grises — y eso **no se ve en la primera pasada: hay que abrir uno**. **Y la premisa del prompt de la tanda era FALSA en su mecanismo** («un DMenu hijo se crea al abrirse, no cuando lo declarás»): se crea al declararse, se leyó en la fuente, y la conclusión sobrevivió pero por otra vía. **Dos filas son CONTROLES NEGATIVOS del tema y son las que separan «tomó el color» de «tiene un color»**: con DGL4 montado el menú CAMBIA de color junto con el HUD, y SIN DGL4 montado no revienta ni sale ilegible. Sin la primera la planilla sólo diría que el menú es oscuro; sin la segunda, que anda en la máquina del autor."
  AG: "ídem P — decimoséptima sección de planilla de Cargo, roadmap #72: drop desde el cinturón. Registrada ANTES de usarse (FLU-30). Sigue a la AF por FLU-07. **La fila que la planilla existe para correr NO se ve en el inventario: se ve al DISPARAR.** El cinturón no es almacenamiento inerte, ES el pool de munición del engine (§16.3, CRG-15), así que un drop que se saltee el `AmmoPool.Push` deja al jugador habiendo tirado la caja y teniendo las balas todavía cargadas — el ítem cae al piso, el inventario queda impecable, y el defecto aparece recién en la próxima recarga. Por eso hay una fila que consiste en RECARGAR después de botar, y no en mirar la pantalla. **La precondición del bloque es la lección 94**: el slot tiene que tener un `count` que NO sea el `max_stack`, o «lo que había en el slot» y «el techo» dan el mismo número y una fila que se equivoque de fuente sale verde igual. **Tres filas son CONTROLES NEGATIVOS de que la puerta nueva no se comió a las viejas**: `Return to inventory` sigue devolviendo al grid y sigue empujando el espejo, un slot vacío no ofrece nada, y el arrastre del cinturón sigue significando devolver/reordenar y NO botar (voto del autor). Lo medido offline y que no hace falta repetir: la conservación, el recorte del `count` contra lo que hay, el gate de rango y el de `Alive()`, y que las dos opciones manden números distintos — 20 checks de server más 8 de cliente, y los 20 sabotajes en rojo."
  AE: "ídem P — decimoquinta sección de planilla de Cargo, roadmap #69 / CRG-74: la gramática del mouse (M1 selecciona, M3 deselecciona, M2 es el menú). Registrada ANTES de usarse (FLU-30). Sigue a la AD porque el alfabeto de una letra se agotó en la Z y no se recicla ninguna (FLU-07). **Su PRIMERA fila es una MEDICIÓN y no un veredicto**, y de ella depende la forma del resto del bloque: que el botón del MEDIO LLEGUE a la celda. Es lo único de la tanda que el harness no puede contestar — probó que `cell.DoMiddleClick` está cableado y que hace lo correcto, pero el despacho es del motor: `DButton` deriva de `DLabel` y `DLabel:OnMouseReleased` manda `MOUSE_MIDDLE` a `DoMiddleClick` (leído en la FUENTE de GMod, no de memoria), y que la capa de drag-and-drop no se coma el press antes del release es indicio y no prueba. **Si esa fila no pasa, todas las de M3 quedan SIN CORRER y NO en rojo**: un cableado que no dispara se ve exactamente igual que una regla mal escrita, y marcarlas rojas acreditaría un defecto de reglas que nadie midió. **La precondición que el bloque tuvo que resolver antes de escribir una fila**: los tres niveles sólo discriminan sobre una celda cuyo `count` NO sea el `max_stack` — con la celda al tope, «un cuarto del techo» y «lo que dice la celda» dan 30 y 120 pero el ALT+SHIFT de un stack solo da 120 también, y la fila deja de distinguir dos niveles (lección 94, que costó una vuelta en el #68). Por eso el kit de la planilla parte los stacks con un `lua_run` corto sobre el record antes de medir. **Los comandos van partidos en líneas de menos de 255 caracteres** con el estado en globales, porque la consola de Source trunca ahí y el síntoma es un error de SINTAXIS de Lua que miente sobre la causa. **Dos filas son las EXCEPCIONES DECLARADAS y son controles negativos de alcance**: que M3 en el loot no haga NADA (voto del autor: la transferencia inversa le pareció contraintuitiva) y que en la FILA del basket M1 siga quitando — una fila es una entrada de lista, no una celda. Sin ellas la planilla sólo diría que lo nuevo anda."
  AD: "ídem P — decimocuarta sección de planilla de Cargo, roadmap #68 / CRG-73: el ref de un stack nombra LA CELDA que apretaste. Registrada ANTES de usarse (FLU-30). Sigue a la AC porque el alfabeto de una letra se agotó en la Z y no se recicla ninguna (FLU-07). **Nace DESPUÉS de una pasada parcial y por eso existe**: el autor cerró en juego los dos síntomas del reporte —el cinturón y los siete stacks que dan siete ítems al botar— y las otras SEIS filas quedaron SIN CORRER; se declararon así en vez de acreditarse (precedente AB14) y esta planilla es lo que las cierra. **Lo que la sección tuvo que resolver antes de escribir una fila, y es su aporte de método:** dos de los caminos —`UseEntry` y `SubSlotAttach`— NO se pueden ejercitar con el kit de dev tal como está, porque `cargo_dev_medkit` y `cargo_dev_plate` no declaran `max_stack` y entonces el grid nunca los parte en dos celdas; y la salida fácil —dos celdas de CONDICIÓN distinta— no sirve, porque el ref viejo `{id, condition}` YA las distinguía, así que la fila saldría verde con el código de antes. La precondición de esas dos filas parte el stack con un `lua_run` corto sobre el record real y después el clic corre por el camino de siempre. **Los comandos van partidos en líneas de menos de 255 caracteres** con el estado en globales, porque la consola de Source trunca en 255 y el síntoma es un error de SINTAXIS de Lua que miente sobre la causa. Cuatro de las trece filas son CONTROLES NEGATIVOS (trader, contenedor, tecla rápida y el relleno del cinturón al volver al grid): son las que prueban que el alcance por camino no se desbordó, y sin ellas la planilla sólo diría que lo nuevo anda."
  AB: "ídem P — duodécima sección de planilla de Cargo, roadmap #53: la configuración ARC9 viaja con el arma. Registrada ANTES de usarse (FLU-30) y con DOS letras, porque el alfabeto de una se agotó en la Z y no se recicla ninguna (FLU-07). **AB1 es una MEDICIÓN y va primera**: si `wep.Attachments` es por entidad o compartida por clase, que es la precondición de la que depende la forma del bloque entero — si resulta compartida, el invariante pedido (la config pertenece a la INSTANCIA) es inalcanzable y la frontera se declara medida en §13 en vez de suponerse. Su instrumento es `cargo_dev_attshare`, y nació corrigiendo la receta del handoff: un jugador sostiene UN SWEP por clase (capture.lua ya lo pagó en juego), así que las dos armas no pueden estar las dos en el inventario — tienen que ser dos ENTIDADES vivas, una en la mano y otra en el suelo. El comando reporta la AUSENCIA como ausencia: encontrar una sola entidad, o dos peladas coincidiendo en nada, sale como NO CONCLUYENTE y no como un resultado. **CERRADA el 2026-07-31 en TRES rondas: 12 en PASA (AB1-AB7, AB9-AB13), AB8 RETIRADO por decisión y AB14 SIN CORRER** — la primera sección del módulo que cierra con un check que nunca se corrió, y se dice así a propósito. **AB8 no falló, se le retiró la premisa**: medía el peso de los atts, el autor diagnosticó que el defecto estaba en el MODELO y no en el número (su MCX de 2,9 kg lleva doce attachments) y el peso se difirió al #55 — un check cuya conducta esperada se retira no es un rojo pendiente, y confundirlos deja deuda fantasma en el registro. **AB13 cerró por la vía NEGATIVA y no por la resta que pedía su ACCIÓN**, y la diferencia es de evidencia, no de redacción: botados los repuestos, el volcado dio grid=0 y hook=0 en las siete líneas y el menú C dejó de ofrecerlos, lo que prueba que el puente contesta lo que el grid tiene y que no hay un tercer inventario — pero **esa misma acción destruyó la precondición de la resta**, y con ella la de AB14, que iba a leer el mismo gesto por la otra mitad. De ahí la lección de la sección, que es la contracara de la de la ronda 2: **un instrumento no debe afirmar lo que no puede medir** (`cargo_dev_attstock` gritaba 'duplicación' sobre una foto que no distingue una copia de un repuesto, y costó una ronda entera de diagnóstico equivocado) **y un check no se marca por la medición de otra cosa**. La frontera de la entry 64 queda declarada en el CHANGELOG en vez de disimulada"
  AC: "ídem P — decimotercera sección de planilla de Cargo, roadmap #56: el peso de la munición cargada. **CERRADA el 2026-08-01 en CUATRO rondas**: 9 en PASA, **AC2 RETIRADO por premisa falsa** (medía el RPG y el RPG no tiene cargador — su pregunta la contestó AC3 sobre un arma que sí lo tiene, y se dice por qué vía cerró), dos rojos que produjeron parche en vez de diagnóstico, y **AC12 como frontera cosmética aceptada** por decisión del autor. **Ninguno de los cuatro parches salió de donde el bloque miraba**: el primero de la NOTA de un check que PASÓ (el éter al equipar, nueve kilos gratis), el segundo del rojo que refutó la PREMISA, el tercero de un reporte que sobrevivió al bloqueante, el cuarto de medir en vez de adivinar un segundo nombre de campo. Y **tres veces la reversión auditó el INSTRUMENTO antes que al código** — dos checks que no distinguían y un pcall cuya ausencia mataba la corrida en vez de enrojecerla. Registrada ANTES de usarse (FLU-30), en el mismo parche que escribe el peso. Sigue la AB porque el alfabeto de una letra se agotó en la Z y no se recicla ninguna (FLU-07). **Lo que mide, y por qué no lo puede medir el harness**: (1) los OCHO valores de la tabla de escape de las armas del engine, que es la única parte del resolver escrita sin poder derivarla del árbol —`weapons.GetStored` devuelve nil para las armas de HL2, así que el harness prueba que la tabla se consulta pero NO que sus valores sean los que el engine usa; CRG-24 vale también para el engine (lección del #46) y por eso se miden una por una en juego; (2) el arsenal REAL del autor, del que `dev/other/` sólo cubre ~2/3 — los packs de EFT SMG/escopetas/LMG, CS:GO y arc9_wtt no están, así que el censo de 243 SWEPs no puede hablar por ellos; (3) la CADENCIA, que es lo único que la decisión del autor eligió por sensación: cuatro refrescos por segundo mientras se dispara es un número medido en costo y no en feel, y si el peso saltando mientras se dispara se siente mal, el defecto está en el modelo y no en el número (lección del #55). El caso estrella —el RPG y sus 3 kg— cae justo en (1), o sea que la mitad más visible del bloque es la que menos cobertura offline tiene"
  AA: "ídem P — undécima sección de planilla de Cargo, roadmap #52: el commit sobre una fuente tapada se rechaza y lo dice con un destello. **El espacio de una letra se agotó en la Z**, así que sigue con DOS letras (AA, AB…) — no se recicla ninguna (FLU-07), que es todo el motivo por el que hizo falta ampliar el alfabeto en vez de volver a empezar. Registrada ANTES de usarse (FLU-30). Nació de la NOTA de Z3, un check que PASÓ — séptima vez en el arco, y esta vez el hallazgo corrigió una DECISIÓN DE DISEÑO y no un defecto. **Cerrada 3/3 el 2026-07-30, y con ella el arco #48-#52 entero**: 23 checks en cinco secciones, ninguna ronda perdida por un defecto de código. **Es la primera del arco que NO abrió un bloque nuevo** — las siete anteriores terminaron con una nota que abría el siguiente, y ésta no; la cadena se detuvo sola y no por dejar de mirar, porque su check negativo recorrió las cinco tandas a propósito"
  Z: "ídem P — décima sección de planilla de Cargo, roadmap #51: la linterna del engine se pinta TAPADA cuando el arma en mano lleva un dispositivo ARC9. Registrada ANTES de usarse (FLU-30). Nació de la NOTA de Y3, un check que PASÓ — sexta vez en el arco. Mide el tramado con y sin dispositivo, que el estado NO se falsee a OFF, y que la superficie de las cuatro tandas anteriores siga intacta"
  Y: "ídem P — novena sección de planilla de Cargo, roadmap #50: el botón derecho cicla en reversa el dispositivo ARC9. Registrada ANTES de usarse (FLU-30), en el mismo parche que la escribe. Nació de la NOTA de X1, un check que PASÓ — quinta vez en el arco. Mide la reversa sobre el arma real, la AUSENCIA (una fuente sin reversa no responde y sobre todo no cae hacia adelante) y que el gesto de siempre siga intacto"
  X: "ídem P — octava sección de planilla de Cargo, roadmap #49: el click que NO cierra el wheel (ciclar un dispositivo ARC9 en una sola pasada). Registrada ANTES de usarse (FLU-30), en el mismo parche que escribe el modo. Mide las DOS decisiones que tomó el autor antes de que se escribiera una línea —el modo es sólo de los chips de luz, y soltar la tecla sólo cierra si ya hubo un click— más la negativa con la convar en 0. **No** se recicla la W: es otra entrada del roadmap y los IDs no se reciclan (FLU-07)"
# Nota de método: la primera versión de esta tabla listaba J/K/L/M, copiados del
# EJEMPLO del handoff ("planilla Caliber, check J4"). Esas letras no existen en
# ningún repo. Es exactamente el error que FLU-27 nombra — enumerar desde un doc en
# vez de derivar del código — cometido en la misma tanda que acuñó la norma. Queda
# anotado acá a propósito: la próxima sección de planilla se suma a esta tabla
# ANTES de usarse (FLU-30), y se deriva del árbol.

ids:

  # ── COR — el framework ──────────────────────────────────────────────────────
  # Sede de COR-1..6 y COR-9: corpus/CLAUDE.md. Sede de COR-7/8/10/11: la
  # arquitectura. Los seis primeros son los "Contratos que no debes romper".

  COR-1:
    titulo: "Nada de lógica de dominio en Corpus: solo registro, persistencia, net, UI shell, ready barrier y log."
    sede: "corpus/CLAUDE.md §Contratos que no debes romper · 1"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: codigo, ref: "corpus/lua/autorun/ — las 6 primitivas y nada más" }
  COR-2:
    titulo: "Namespace único: todo cuelga del global Corpus; los módulos se acceden vía Corpus.GetModule, nunca como globals sueltos."
    sede: "corpus/CLAUDE.md §Contratos que no debes romper · 2"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: selftest, ref: "corpus/lua/autorun/corpus_selftest.lua" }
  COR-3:
    titulo: "Persistencia namespaced: un módulo no escribe fuera de su propio namespace de Corpus.Data; la RUTA la resuelve el scope (COR-19), no una constante."
    sede: "corpus/CLAUDE.md §Contratos que no debes romper · 3"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: selftest, ref: "corpus/lua/autorun/corpus_selftest.lua" }
    nota: >
      ENMENDADA 2026-07-25 al entrar el scope. Lo que NO cambió: el namespace por
      módulo, que es el invariante. Lo que cambió: la ruta dejó de ser el literal
      data/corpus/<module>/<key>.json PARA SIEMPRE — hoy resuelve ahí para los dos
      scopes a propósito (COR-19), y el resolver es el único lugar que la conoce.
      Sede y fuerza intactas; la superficie de la primitiva creció a
      Save/Load/List/Delete y la otra mitad del contrato es COR-18.
  COR-4:
    titulo: "Net namespaced: Corpus.Net.Register(module, msgName) → \"corpus_<module>_<msgName>\", para evitar colisión global de net.Receive."
    sede: "corpus/CLAUDE.md §Contratos que no debes romper · 4"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: selftest, ref: "corpus/lua/autorun/corpus_selftest.lua" }
  COR-5:
    titulo: "Detección, nunca asunción: ningún módulo asume que Corpus u otro módulo ya cargó — lazy check o Corpus.OnReady."
    sede: "corpus/CLAUDE.md §Contratos que no debes romper · 5"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: codigo, ref: "corpus-caliber — boot diferido a Initialize (CAL-1), el patrón template" }
      - { tipo: codigo, ref: "corpus/lua/autorun/corpus_ready.lua — la barrera dispara con la PRIMERA de varias señales y con guard de idempotencia; el mecanismo y su medición viven en el header del archivo y en el CHANGELOG del 2026-08-09 (arco B ronda 2)" }
  COR-6:
    titulo: "Prefijo de archivo por addon: los seis consumidores (cinco módulos + corpus-stalker) usan corpus_<addon>_*.lua en todo su árbol Lua; el framework se reserva corpus_<primitiva>.lua. Contra colisión entre los siete addons montados a la vez."
    sede: "corpus/CLAUDE.md §Contratos que no debes romper · 6"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: codigo, ref: "corpus/lua/autorun/corpus_<primitiva>.lua sin segmento vs. corpus-cargo/lua/autorun/corpus_cargo_init.lua con segmento" }
    nota: "Reformulado el 2026-07-19 (voto del autor sobre el hallazgo 2.4 del acta v3 + el voto abierto del CHANGELOG): cierra los dos ejes podridos de la cláusula vieja — «siete addons» cuando el framework usa el prefijo desnudo load-bearing, y «en lua/autorun/» cuando el árbol de los módulos vive fuera."
  COR-7:
    titulo: "Invariante by-ref: RegisterModule y GetModule guardan y devuelven la MISMA tabla por referencia — sin deep-copy ni normalización."
    sede: "corpus/docs/CORPUS_Architecture.md §3"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: harness, ref: "harness offline de Corpus, 46 checks, ambos realms (2026-07-09)" }
      - { tipo: codigo, ref: "corpus-caliber — el patrón 'tabla vacía poblada por side-effect' depende de esto" }
  COR-8:
    titulo: "Corpus.Data SÍ normaliza en el round-trip JSON: lo que sale de Load puede no tener el tipo de clave que entró en Save — contrato distinto a COR-7."
    sede: "corpus/docs/CORPUS_Architecture.md §3"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia: INTENCION
  COR-9:
    titulo: "Cada archivo del framework es autosuficiente (`Corpus = Corpus or {}` al tope) y no asume orden de carga dentro de lua/autorun/."
    sede: "corpus/CLAUDE.md §Contratos que no debes romper · 7"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: codigo, ref: "el tope de cada archivo de corpus/lua/autorun/" }
  COR-10:
    titulo: "Regla cardinal — framework delgado: solo sube infraestructura demostrablemente compartida; ni siquiera una pieza de dominio compartida por dos módulos sube."
    sede: "corpus/docs/CORPUS_Architecture.md §3-4"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: codigo, ref: "el pool de HP de extremidades vive en Caliber (corpus_caliber_limbs.lua), no en Corpus" }
  COR-11:
    titulo: "Regla cardinal — la única hard-dep del ecosistema es Corpus; todo lo demás es soft-dep detectada en runtime."
    sede: "corpus/docs/CORPUS_Architecture.md §2"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: codigo, ref: "los edges soft con lazy-check + pcall y degradación honesta (§2 tabla)" }
  COR-12:
    titulo: "La def de ítem Y su onUse se registran en AMBOS realms (shared); el onUse solo CORRE en server."
    sede: "corpus/docs/CORPUS_Architecture.md §5"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: planilla, ref: "Coagulant punto E — ronda 1 ✗ → ronda 2 ✓ 14/14 (la def invisible)" }
      - { tipo: codigo, ref: "Coagulant slice 2 PARCHE 8 — el gate isfunction(def.onUse) client-side" }
      - { tipo: harness, ref: "dev/harness_craving.py — pasada CLIENT con Cargo fake: las 6 defs y su onUse se registran también en el cliente" }
      - { tipo: harness, ref: "dev/harness_coagulant.py — pasada CLIENT con Cargo fake: las 4 defs médicas y su onUse se registran también en el cliente" }
    nota: >
      LA NORMA MÁS CARA DEL ECOSISTEMA. Son dos mitades pagadas por separado: una def
      solo-server no existe en el cliente y el grid no la renderiza (el snapshot de Cargo
      solo transporta las defs autogen/icon_override); y la UI exige isfunction(def.onUse)
      client-side para habilitar «Use» y el quick bind, así que un onUse solo-server deja
      el ítem visible pero inusable.
      POR QUÉ VIVE EN EL FRAMEWORK Y NO EN CARGO (voto del autor 2026-07-20, deuda D-14):
      porque NO gobierna ítems — gobierna el PROTOCOLO DE REGISTRO entre módulos, del
      linaje de COR-3 y COR-4. Enuncia la FORMA del contrato, jamás la SEMÁNTICA del ítem:
      si algún día menciona stacks, peso o slots, bajó dominio al framework y el voto se
      reabre. D-1 (que Cargo la CITE) y D-14 (dónde vive) están ambas CERRADAS.
  COR-13:
    titulo: "El retorno de onUse gobierna el consumo: Cargo descuenta una unidad solo si devuelve true; false habilita el consumo diferido y el rechazo."
    sede: "corpus/docs/CORPUS_Architecture.md §5"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: planilla, ref: "Coagulant G2 y G5 (consumo diferido); Craving en juego (rechazo con barra llena)" }
      - { tipo: selftest, ref: "cargo_selftest — contrato" }
    nota: "Las dos ramas del false están en uso real: Coagulant descuenta al completar (COA-3) y Craving rechaza con el stat lleno (CRV-8). El CLAUDE.md de Cargo la enuncia en media línea, sin los dos casos."
  COR-14:
    titulo: "Ningún módulo de dominio necesita Cargo para funcionar: solo lo aprovecha si está."
    sede: "corpus/docs/CORPUS_Architecture.md §5"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: codigo, ref: "Coagulant: vía mínima propia sin Cargo; Craving: entity de mundo con WALK+USE" }
  COR-15:
    titulo: "UI shell vía la primitiva: una sola entrada por módulo en el menú Q (Corpus.UI.RegisterTab, categoría única Corpus); las ventanas adicionales se abren por botón/concommand desde su tab, y los stools quedan fuera de la norma (pestaña Tools, categoría del módulo)."
    sede: "corpus/CLAUDE.md §Contratos que no debes romper · 8"
    fuerza: INVARIANTE
    estado: VIGENTE
    evidencia:
      - { tipo: codigo, ref: "check visual 2026-07-09: tab de Caliber en Q → Utilities → Corpus; el browser por-NPC va por concommand caliber_browser" }
    nota: "Acuñado el 2026-07-19 (voto D-11): la prosa vivía en el CLAUDE.md de Caliber (su contrato 5), que ahora la cita."
  COR-16:
